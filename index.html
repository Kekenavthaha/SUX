<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SUX — эфирная связь</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            overflow: hidden;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: #eef4ff;
            background: #03060c;
        }

        /* ========== МНОГОУРОВНЕВЫЙ ТЁМНЫЙ ГРАДИЕНТ ДЛЯ ФОНА (постоянный) ========== */
        .bg-gradient {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 30%, #0a1428, #03071a);
            z-index: 0;
        }
        /* Дополнительные слои для глубины (переливы) */
        .bg-layer1 {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 70% 50%, rgba(0, 80, 120, 0.15), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }
        .bg-layer2 {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 30% 80%, rgba(0, 150, 180, 0.08), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        .bg-layer3 {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 90% 20%, rgba(50, 100, 150, 0.1), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* Лёгкая текстура (почти незаметная) */
        .noise {
            position: fixed;
            inset: 0;
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIj48ZmlsdGVyIGlkPSJmIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iLjgiIG51bU9jdGF2ZXM9IjMiLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWx0ZXI9InVybCgjZikiIG9wYWNpdHk9IjAuMDMiLz48L3N2Zz4=');
            background-repeat: repeat;
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }

        /* Vignette для затемнения краёв */
        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, transparent 55%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* ========== ЗАГРУЗОЧНЫЙ ЭКРАН (тёмный градиент) ========== */
        .splash {
            position: fixed;
            inset: 0;
            background: #03060c;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease;
        }
        .splash.hide {
            opacity: 0;
            pointer-events: none;
        }
        /* Градиент внутри сплеша (многоуровневый, но приглушённый) */
        .splash-bg {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 40%, #0a1a30, #010a18);
            z-index: -1;
        }
        .splash-bg::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 70% 60%, rgba(0, 120, 150, 0.12), transparent 60%);
        }
        .splash-bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 20% 80%, rgba(0, 180, 200, 0.08), transparent 70%);
        }
        .splash-logo {
            font-size: 86px;
            font-weight: 700;
            font-family: monospace;
            letter-spacing: 12px;
            background: linear-gradient(135deg, #8aaeff, #4a6ee0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: softPulse 1.4s infinite alternate;
            position: relative;
            z-index: 2;
        }
        .splash-title {
            margin-top: 20px;
            font-size: 15px;
            letter-spacing: 3px;
            color: #6a8eff;
            font-weight: 300;
            position: relative;
            z-index: 2;
        }
        @keyframes softPulse {
            0% { opacity: 0.6; transform: scale(0.98); text-shadow: 0 0 5px #3a6eff; }
            100% { opacity: 1; transform: scale(1.01); text-shadow: 0 0 20px #3a6eff; }
        }

        /* ========== ОСНОВНОЙ UI ========== */
        .top-bar {
            position: fixed;
            top: 16px;
            left: 16px;
            right: 16px;
            background: rgba(10, 18, 30, 0.7);
            backdrop-filter: blur(24px);
            border-radius: 60px;
            border: 1px solid rgba(100, 150, 255, 0.2);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            box-shadow: 0 6px 18px rgba(0,0,0,0.3);
        }
        .balance {
            background: rgba(0,0,0,0.4);
            border-radius: 40px;
            padding: 5px 16px;
            font-weight: 600;
            font-size: 17px;
            color: #ffde9e;
            border: 1px solid rgba(255,220,100,0.2);
        }
        .user {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
        }
        .avatar {
            width: 34px;
            height: 34px;
            background: linear-gradient(145deg, #4b6ef0, #2b4ad0);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        /* ========== ОБЛАСТЬ КОНТЕНТА ========== */
        .content {
            position: fixed;
            top: 90px;
            left: 16px;
            right: 16px;
            bottom: 100px;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(18px);
            border-radius: 36px;
            border: 1px solid rgba(100, 150, 255, 0.2);
            padding: 20px;
            overflow-y: auto;
            z-index: 10;
            scrollbar-width: thin;
        }
        .card {
            background: rgba(20, 30, 50, 0.6);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(100, 150, 255, 0.2);
            backdrop-filter: blur(4px);
        }
        .card h2 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #cbdffc;
            font-weight: 500;
        }
        .card button {
            background: #2b4ad0;
            border: none;
            padding: 12px 16px;
            border-radius: 48px;
            color: white;
            font-weight: 600;
            margin-top: 14px;
            width: 100%;
            cursor: pointer;
            transition: 0.1s;
        }
        .card button:active {
            transform: scale(0.97);
            background: #1e3aad;
        }

        /* ========== НИЖНЕЕ МЕНЮ (5 вкладок) ========== */
        .bottom {
            position: fixed;
            bottom: 18px;
            left: 16px;
            right: 16px;
            background: rgba(10, 18, 30, 0.8);
            backdrop-filter: blur(28px);
            border-radius: 48px;
            padding: 8px 12px;
            border: 1px solid rgba(100, 150, 255, 0.25);
            z-index: 10;
        }
        .menu {
            display: flex;
            justify-content: space-around;
            gap: 4px;
        }
        .tab {
            flex: 1;
            background: transparent;
            border: none;
            color: rgba(200, 220, 255, 0.6);
            font-size: 20px;
            padding: 10px 0;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }
        .tab span {
            font-size: 13px;
            display: none;
        }
        .tab.active {
            background: rgba(75, 110, 240, 0.3);
            color: #b4c8ff;
            text-shadow: 0 0 6px rgba(100, 150, 255, 0.3);
        }
        @media (min-width: 500px) {
            .tab span { display: inline; }
            .tab { font-size: 16px; gap: 8px; }
        }
    </style>
</head>
<body>

<!-- Постоянный фон (тёмный многослойный градиент) -->
<div class="bg-gradient"></div>
<div class="bg-layer1"></div>
<div class="bg-layer2"></div>
<div class="bg-layer3"></div>
<div class="noise"></div>
<div class="vignette"></div>

<!-- Загрузочный экран -->
<div class="splash" id="splash">
    <div class="splash-bg"></div>
    <div class="splash-logo">SUX</div>
    <div class="splash-title">ЗАГРУЗКА ЭФИРА</div>
</div>

<!-- Верхняя панель -->
<div class="top-bar" id="topBar">
    <div class="user">
        <div class="avatar">🦀</div>
        <span>Краб Гражданин</span>
    </div>
    <div class="balance" id="balanceDisplay">12 500 кр.</div>
</div>

<!-- Контент -->
<div class="content" id="content"></div>

<!-- Нижнее меню (без главной) -->
<div class="bottom">
    <div class="menu">
        <button class="tab active" data-tab="profile">👤<span>Профиль</span></button>
        <button class="tab" data-tab="bank">🏦<span>Банк</span></button>
        <button class="tab" data-tab="darknet">🕶️<span>Даркнет</span></button>
        <button class="tab" data-tab="court">⚖️<span>Суд</span></button>
        <button class="tab" data-tab="housing">🏙️<span>Жильё</span></button>
    </div>
</div>

<script>
    // ========== UI ЛОГИКА ==========
    const tabs = document.querySelectorAll('.tab');
    const contentDiv = document.getElementById('content');
    const splash = document.getElementById('splash');
    const balanceSpan = document.getElementById('balanceDisplay');

    let currentBalance = 12500;
    function updateBalanceUI() {
        balanceSpan.innerText = currentBalance.toLocaleString() + ' кр.';
    }

    function renderContent(tab) {
        let html = '';
        if(tab === 'profile') {
            html = `<div class="card">
                        <h2>👤 ПРОФИЛЬ</h2>
                        <div>Социальный рейтинг: <strong>${currentBalance}</strong></div>
                        <div>Ранг: Достойный гражданин</div>
                        <div>Сообщений: 342</div>
                        <div>Эффекты: нет</div>
                        <button id="refreshBtn">Обновить</button>
                    </div>`;
        } else if(tab === 'bank') {
            html = `<div class="card"><h2>🏦 К-БАНК</h2><div>Кредиты: до 2000 кр.</div><div>Инвестиции: 4-15%</div><button>Взять кредит</button></div>`;
        } else if(tab === 'darknet') {
            html = `<div class="card"><h2>🕶️ ДАРКНЕТ</h2><div>Теневой кошелёк: 0 кр.</div><div>Грибы • Крабедрон</div><button>Перейти</button></div>`;
        } else if(tab === 'court') {
            html = `<div class="card"><h2>⚖️ СУД</h2><div>Активных исков: 0</div><button>Подать иск</button></div>`;
        } else if(tab === 'housing') {
            html = `<div class="card"><h2>🏙️ КРАБ-ЙОРК</h2><div>Крабхэттен • Студия от 3 млн</div><button>Выбрать жильё</button></div>`;
        }
        contentDiv.innerHTML = html;
        if(tab === 'profile') {
            document.getElementById('refreshBtn')?.addEventListener('click', () => {
                currentBalance += Math.floor(Math.random() * 500);
                updateBalanceUI();
                renderContent('profile');
            });
        }
    }

    function setActiveTab(tab) {
        tabs.forEach(btn => {
            btn.classList.remove('active');
            if(btn.dataset.tab === tab) btn.classList.add('active');
        });
        renderContent(tab);
    }

    tabs.forEach(btn => {
        btn.addEventListener('click', () => setActiveTab(btn.dataset.tab));
    });

    // Splash на 5 секунд, затем скрываем и показываем первую вкладку (Профиль)
    setTimeout(() => {
        splash.classList.add('hide');
        setTimeout(() => { splash.style.display = 'none'; }, 800);
        setActiveTab('profile');   // Стартовая вкладка после загрузки
        updateBalanceUI();
    }, 5000);
</script>
</body>
</html>
