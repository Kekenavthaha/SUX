<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SUX — плавный поток</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            overflow: hidden;
            background: #0a0f1c;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: #eef4ff;
        }

        /* ========== ФОН (глубокий, без сетки) ========== */
        .bg {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 30% 20%, #0e152a, #02040c);
            animation: cosmicBreath 14s infinite alternate ease-in-out;
        }
        @keyframes cosmicBreath {
            0% { opacity: 0.9; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.02); }
        }

        .vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle, transparent 55%, rgba(0,0,0,0.5) 100%);
        }

        /* ========== SPLASH (5 сек) ========== */
        .splash {
            position: fixed;
            inset: 0;
            background: #0a0f1c;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease;
        }
        .splash.hide {
            opacity: 0;
            pointer-events: none;
        }
        .splash-logo {
            font-size: 86px;
            font-weight: 700;
            font-family: monospace;
            letter-spacing: 12px;
            background: linear-gradient(135deg, #bcd0ff, #6a8eff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: softPulse 1.4s infinite alternate;
        }
        .splash-title {
            margin-top: 20px;
            font-size: 15px;
            letter-spacing: 3px;
            color: #8aa9ff;
        }
        @keyframes softPulse {
            0% { opacity: 0.5; transform: scale(0.98); text-shadow: 0 0 5px #5a7eff; }
            100% { opacity: 1; transform: scale(1.01); text-shadow: 0 0 20px #5a7eff; }
        }

        /* ========== КОНТЕЙНЕР ДЛЯ АНИМАЦИИ (северное сияние, плавное) ========== */
        .aurora-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(280px, 70vw);
            height: min(280px, 70vw);
            z-index: 4;
            pointer-events: none;
            filter: blur(4px);
        }
        canvas#aurora {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: block;
        }

        /* ========== ЛОГОТИП И СЛОГАН ========== */
        .logo {
            position: fixed;
            bottom: 12%;
            width: 100%;
            text-align: center;
            font-size: clamp(42px, 10vw, 82px);
            font-weight: 700;
            font-family: monospace;
            letter-spacing: 8px;
            background: linear-gradient(135deg, #eef4ff, #bdd4ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 15px rgba(0,0,0,0.2);
            z-index: 5;
            transition: opacity 0.25s;
        }
        .slogan {
            position: fixed;
            width: 100%;
            bottom: 6%;
            text-align: center;
            color: #8aa9ff;
            letter-spacing: 2px;
            font-size: 12px;
            font-weight: 300;
            z-index: 5;
            transition: opacity 0.25s;
        }
        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* ========== ВЕРХНЯЯ ПАНЕЛЬ ========== */
        .top-bar {
            position: fixed;
            top: 16px;
            left: 16px;
            right: 16px;
            background: rgba(18, 25, 45, 0.6);
            backdrop-filter: blur(24px);
            border-radius: 60px;
            border: 1px solid rgba(140, 170, 255, 0.3);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            transition: opacity 0.25s;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
        }
        .balance {
            background: rgba(0,0,0,0.3);
            border-radius: 40px;
            padding: 5px 16px;
            font-weight: 600;
            font-size: 17px;
            color: #ffde9e;
            border: 1px solid rgba(255,220,100,0.3);
        }
        .user {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        .avatar {
            width: 34px;
            height: 34px;
            background: linear-gradient(145deg, #4b6ef0, #2b4ad0);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        /* ========== ОБЛАСТЬ КОНТЕНТА ========== */
        .content {
            position: fixed;
            top: 90px;
            left: 16px;
            right: 16px;
            bottom: 100px;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(18px);
            border-radius: 36px;
            border: 1px solid rgba(140, 170, 255, 0.2);
            padding: 20px;
            overflow-y: auto;
            z-index: 10;
            transition: opacity 0.25s;
        }
        .card {
            background: rgba(30, 40, 65, 0.5);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(140, 170, 255, 0.2);
            backdrop-filter: blur(4px);
        }
        .card h2 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #cbdffc;
        }
        .card button {
            background: #3b5bdb;
            border: none;
            padding: 12px 16px;
            border-radius: 48px;
            color: white;
            font-weight: 600;
            margin-top: 14px;
            width: 100%;
            cursor: pointer;
            transition: 0.1s;
        }
        .card button:active {
            transform: scale(0.97);
            background: #2a46b0;
        }

        /* ========== НИЖНЕЕ МЕНЮ ========== */
        .bottom {
            position: fixed;
            bottom: 18px;
            left: 16px;
            right: 16px;
            background: rgba(18, 25, 45, 0.75);
            backdrop-filter: blur(28px);
            border-radius: 48px;
            padding: 8px 12px;
            border: 1px solid rgba(140, 170, 255, 0.35);
            z-index: 10;
        }
        .menu {
            display: flex;
            justify-content: space-around;
            gap: 4px;
        }
        .tab {
            flex: 1;
            background: transparent;
            border: none;
            color: rgba(220, 240, 255, 0.6);
            font-size: 20px;
            padding: 10px 0;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }
        .tab span {
            font-size: 13px;
            display: none;
        }
        .tab.active {
            background: rgba(75, 110, 240, 0.25);
            color: #b4c8ff;
        }
        @media (min-width: 500px) {
            .tab span { display: inline; }
            .tab { font-size: 16px; gap: 8px; }
        }
    </style>
</head>
<body>

<div class="bg"></div>
<div class="vignette"></div>

<div class="splash" id="splash">
    <div class="splash-logo">SUX</div>
    <div class="splash-title">ЗАРЯЖАЮ ЭФИР</div>
</div>

<div class="aurora-container">
    <canvas id="aurora" width="800" height="800"></canvas>
</div>

<div class="logo" id="logo">SUX</div>
<div class="slogan" id="slogan">Поток • Присутствие • Свет</div>

<div class="top-bar hidden" id="topBar">
    <div class="user">
        <div class="avatar">🦀</div>
        <span>Краб Гражданин</span>
    </div>
    <div class="balance" id="balanceDisplay">12 500 кр.</div>
</div>

<div class="content hidden" id="content"></div>

<div class="bottom">
    <div class="menu">
        <button class="tab active" data-tab="home">🏠<span>Главная</span></button>
        <button class="tab" data-tab="profile">👤<span>Профиль</span></button>
        <button class="tab" data-tab="bank">🏦<span>Банк</span></button>
        <button class="tab" data-tab="darknet">🕶️<span>Даркнет</span></button>
        <button class="tab" data-tab="court">⚖️<span>Суд</span></button>
        <button class="tab" data-tab="housing">🏙️<span>Жильё</span></button>
    </div>
</div>

<script>
    // ========== ПЛАВНАЯ АНИМАЦИЯ "СЕВЕРНОЕ СИЯНИЕ" (без пикселей, без квадратов) ==========
    const canvas = document.getElementById('aurora');
    const ctx = canvas.getContext('2d');
    let width, height;
    
    function resizeCanvas() {
        const container = canvas.parentElement;
        const size = container.clientWidth;
        canvas.width = 800;
        canvas.height = 800;
        width = 800;
        height = 800;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    
    let time = 0;
    
    function drawAurora() {
        if (!ctx) return;
        ctx.clearRect(0, 0, width, height);
        
        // рисуем плавные изогнутые ленты (абстрактное северное сияние)
        // используем множество полупрозрачных кривых с размытием
        
        const centerX = width/2;
        const centerY = height/2;
        
        for (let layer = 0; layer < 5; layer++) {
            const offset = layer * 0.7;
            const hue = (time * 0.05 + layer * 20) % 360;
            const lightness = 45 + Math.sin(time * 0.8 + layer) * 12;
            
            ctx.beginPath();
            // создаём несколько плавных волн
            for (let t = 0; t <= 1; t += 0.02) {
                const angle = t * Math.PI * 2;
                // радиус пульсирует и искажается
                const rad = 180 + Math.sin(angle * 3 + time) * 25 + Math.cos(angle * 5 - time * 0.7) * 15;
                const x = centerX + Math.cos(angle + time * 0.3 + layer) * rad;
                const y = centerY + Math.sin(angle * 1.2 + time * 0.5) * (rad * 0.7);
                if (t === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            
            // мягкий градиент
            const grad = ctx.createLinearGradient(centerX - 100, centerY - 100, centerX + 100, centerY + 100);
            grad.addColorStop(0, `hsla(${hue}, 80%, ${lightness}%, 0.35)`);
            grad.addColorStop(0.5, `hsla(${hue + 30}, 85%, ${lightness + 10}%, 0.5)`);
            grad.addColorStop(1, `hsla(${hue + 60}, 75%, ${lightness - 5}%, 0.25)`);
            ctx.fillStyle = grad;
            ctx.fill();
            
            // дополнительное размытие через тень
            ctx.shadowBlur = 25;
            ctx.shadowColor = `hsla(${hue}, 80%, 60%, 0.5)`;
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        
        // добавим переливающиеся "ленты" — кривые Безье
        for (let i = 0; i < 8; i++) {
            const tOff = time * 0.2 + i;
            ctx.beginPath();
            const startX = centerX - 150 + Math.sin(tOff) * 100;
            const startY = centerY - 100 + Math.cos(tOff * 1.3) * 70;
            const cp1x = centerX - 50 + Math.sin(tOff * 1.7) * 120;
            const cp1y = centerY + 50 + Math.cos(tOff * 2.1) * 80;
            const cp2x = centerX + 50 + Math.cos(tOff * 1.4) * 110;
            const cp2y = centerY - 30 + Math.sin(tOff * 1.9) * 90;
            const endX = centerX + 160 + Math.sin(tOff * 2.3) * 80;
            const endY = centerY + 70 + Math.cos(tOff * 1.1) * 60;
            ctx.moveTo(startX, startY);
            ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, endX, endY);
            ctx.lineWidth = 18;
            ctx.strokeStyle = `hsla(${200 + i * 15 + Math.sin(time) * 20}, 75%, 60%, 0.45)`;
            ctx.stroke();
            ctx.lineWidth = 8;
            ctx.strokeStyle = `hsla(${180 + i * 20}, 80%, 70%, 0.6)`;
            ctx.stroke();
        }
        
        // финальные мягкие размытые пятна
        ctx.globalCompositeOperation = 'lighter';
        for (let p = 0; p < 12; p++) {
            const angle = time * 0.5 + p;
            const x = centerX + Math.sin(angle) * 140;
            const y = centerY + Math.cos(angle * 1.4) * 110;
            const rad = 45 + Math.sin(time * 2 + p) * 12;
            const gradRad = ctx.createRadialGradient(x, y, 5, x, y, rad);
            gradRad.addColorStop(0, `hsla(${160 + p * 12}, 85%, 65%, 0.4)`);
            gradRad.addColorStop(1, `hsla(${190 + p * 8}, 75%, 50%, 0)`);
            ctx.fillStyle = gradRad;
            ctx.beginPath();
            ctx.arc(x, y, rad, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalCompositeOperation = 'source-over';
        
        time += 0.03;
        requestAnimationFrame(drawAurora);
    }
    
    drawAurora();
    
    // ========== UI ЛОГИКА ==========
    const tabs = document.querySelectorAll('.tab');
    const logo = document.getElementById('logo');
    const slogan = document.getElementById('slogan');
    const topBar = document.getElementById('topBar');
    const contentDiv = document.getElementById('content');
    const splash = document.getElementById('splash');
    const balanceSpan = document.getElementById('balanceDisplay');
    const auroraContainer = document.querySelector('.aurora-container');
    
    let currentBalance = 12500;
    function updateBalanceUI() {
        balanceSpan.innerText = currentBalance.toLocaleString() + ' кр.';
    }
    
    function renderContent(tab) {
        let html = '';
        if(tab === 'profile') {
            html = `<div class="card">
                        <h2>👤 ПРОФИЛЬ</h2>
                        <div>Социальный рейтинг: <strong>${currentBalance}</strong></div>
                        <div>Ранг: Достойный гражданин</div>
                        <div>Сообщений: 342</div>
                        <div>Эффекты: нет</div>
                        <button id="refreshBtn">Обновить</button>
                    </div>`;
        } else if(tab === 'bank') {
            html = `<div class="card"><h2>🏦 К-БАНК</h2><div>Кредиты: до 2000 кр.</div><div>Инвестиции: 4-15%</div><button>Взять кредит</button></div>`;
        } else if(tab === 'darknet') {
            html = `<div class="card"><h2>🕶️ ДАРКНЕТ</h2><div>Теневой кошелёк: 0 кр.</div><div>Грибы • Крабедрон</div><button>Перейти</button></div>`;
        } else if(tab === 'court') {
            html = `<div class="card"><h2>⚖️ СУД</h2><div>Активных исков: 0</div><button>Подать иск</button></div>`;
        } else if(tab === 'housing') {
            html = `<div class="card"><h2>🏙️ КРАБ-ЙОРК</h2><div>Крабхэттен • Студия от 3 млн</div><button>Выбрать жильё</button></div>`;
        }
        contentDiv.innerHTML = html;
        if(tab === 'profile') {
            document.getElementById('refreshBtn')?.addEventListener('click', () => {
                currentBalance += Math.floor(Math.random() * 500);
                updateBalanceUI();
                renderContent('profile');
            });
        }
    }
    
    function setActiveTab(tab) {
        tabs.forEach(btn => {
            btn.classList.remove('active');
            if(btn.dataset.tab === tab) btn.classList.add('active');
        });
        if(tab === 'home') {
            auroraContainer.style.opacity = '1';
            auroraContainer.style.visibility = 'visible';
            logo.classList.remove('hidden');
            slogan.classList.remove('hidden');
            topBar.classList.add('hidden');
            contentDiv.classList.add('hidden');
        } else {
            auroraContainer.style.opacity = '0';
            auroraContainer.style.visibility = 'hidden';
            logo.classList.add('hidden');
            slogan.classList.add('hidden');
            topBar.classList.remove('hidden');
            contentDiv.classList.remove('hidden');
            renderContent(tab);
        }
    }
    
    tabs.forEach(btn => {
        btn.addEventListener('click', () => setActiveTab(btn.dataset.tab));
    });
    
    // Splash 5 секунд
    setTimeout(() => {
        splash.classList.add('hide');
        setTimeout(() => { splash.style.display = 'none'; }, 800);
        setActiveTab('home');
        updateBalanceUI();
    }, 5000);
</script>
</body>
</html>
