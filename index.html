<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SUX — AI Surveillance UI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
}

body{
    overflow:hidden;
    background:#05070c;
    font-family:Segoe UI,sans-serif;
    color:white;
}

/* =========================
   BACKGROUND
========================= */

.bg{
    position:fixed;
    inset:0;

    background:
    radial-gradient(circle at top left,
    rgba(70,120,255,.15), transparent 30%),

    radial-gradient(circle at bottom right,
    rgba(255,40,40,.08), transparent 35%),

    linear-gradient(
    135deg,
    #05070c,
    #090f18,
    #070b10);

    animation:bgFlow 16s ease infinite alternate;
}

@keyframes bgFlow{

    from{
        filter:hue-rotate(0deg);
        transform:scale(1);
    }

    to{
        filter:hue-rotate(18deg);
        transform:scale(1.05);
    }
}

.grid{
    position:fixed;
    inset:0;

    background-image:
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);

    background-size:42px 42px;

    opacity:.55;
}

.scanlines{
    position:fixed;
    inset:0;

    background:
    repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,.02) 0px,
    rgba(255,255,255,.02) 1px,
    transparent 2px,
    transparent 4px);

    opacity:.25;
}

.vignette{
    position:fixed;
    inset:0;

    background:
    radial-gradient(circle,
    transparent 45%,
    rgba(0,0,0,.45) 100%);
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:50;
    pointer-events:none;
}

/* =========================
   LOGO
========================= */

.logo{
    position:fixed;

    bottom:14%;
    width:100%;

    text-align:center;

    font-size:92px;
    font-weight:900;

    font-family:monospace;

    letter-spacing:14px;

    color:rgba(255,70,70,.75);

    text-shadow:
    0 0 12px rgba(255,0,0,.45),
    0 0 32px rgba(255,0,0,.22);

    z-index:5;

    transition:.25s;
}

.slogan{
    position:fixed;

    width:100%;
    bottom:8%;

    text-align:center;

    color:rgba(255,255,255,.4);

    letter-spacing:4px;

    font-size:12px;

    z-index:5;

    transition:.25s;
}

.hidden{
    opacity:0;
    pointer-events:none;
}

/* =========================
   TOP BAR
========================= */

.top-bar{
    position:fixed;

    top:16px;
    left:16px;
    right:16px;

    padding:14px 20px;

    background:rgba(10,15,25,.55);

    border-radius:999px;

    border:1px solid rgba(255,70,70,.25);

    backdrop-filter:blur(18px);

    display:flex;
    justify-content:space-between;
    align-items:center;

    z-index:10;

    transition:.25s;

    overflow:hidden;
}

.balance{
    color:#ffd86a;
    font-weight:700;
}

.user{
    display:flex;
    align-items:center;
    gap:10px;
    position:relative;
    padding-left:34px;
}

.avatar{
    width:34px;
    height:34px;

    border-radius:50%;

    background:#c33;

    display:flex;
    align-items:center;
    justify-content:center;
}

/* =========================
   CONTENT
========================= */

.content{
    position:fixed;

    top:90px;
    left:16px;
    right:16px;
    bottom:100px;

    background:rgba(0,0,0,.35);

    border-radius:32px;

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.08);

    padding:24px;

    overflow:auto;

    z-index:10;

    transition:.25s;
}

.card{
    background:rgba(255,255,255,.05);

    border-radius:24px;

    padding:18px;

    margin-bottom:14px;
}

/* =========================
   BOTTOM MENU
========================= */

.bottom{
    position:fixed;

    bottom:18px;
    left:16px;
    right:16px;

    background:rgba(10,15,25,.65);

    border-radius:36px;

    padding:10px;

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,70,70,.25);

    z-index:10;
}

.menu{
    display:flex;
    gap:8px;
}

.tab{
    flex:1;

    border:none;

    background:transparent;

    color:rgba(255,255,255,.6);

    padding:10px;

    border-radius:24px;

    cursor:pointer;

    transition:.15s;
}

.tab.active{
    background:rgba(255,70,70,.15);
    color:#ff6b6b;
}

</style>
</head>
<body>

<div class="bg"></div>
<div class="grid"></div>
<div class="scanlines"></div>
<div class="vignette"></div>

<canvas id="canvas"></canvas>

<div class="logo" id="logo">
SUX
</div>

<div class="slogan" id="slogan">
I SEE • I LISTEN • I REMEMBER
</div>

<div class="top-bar hidden" id="topBar">

    <div class="user">

        <div class="avatar">
        🦀
        </div>

        <div>
        Краб Гражданин
        </div>

    </div>

    <div class="balance">
    12 500 кр.
    </div>

</div>

<div class="content hidden" id="content">

</div>

<div class="bottom">

    <div class="menu">

        <button class="tab active"
        data-tab="home">
        🏠
        </button>

        <button class="tab"
        data-tab="profile">
        👤
        </button>

        <button class="tab"
        data-tab="bank">
        🏦
        </button>

        <button class="tab"
        data-tab="darknet">
        🕶️
        </button>

        <button class="tab"
        data-tab="court">
        ⚖️
        </button>

        <button class="tab"
        data-tab="housing">
        🏙️
        </button>

    </div>

</div>

<script>

/* =========================
   CANVAS
========================= */

const canvas =
document.getElementById('canvas');

const ctx =
canvas.getContext('2d');

let w,h;

function resize(){

    w = canvas.width =
    innerWidth;

    h = canvas.height =
    innerHeight;
}

resize();

addEventListener('resize',resize);

/* =========================
   EYE STATE
========================= */

let eyeState = {

    x: innerWidth/2,
    y: innerHeight/2 - 40,

    scale:1,
    spacing:160,

    targetX:innerWidth/2,
    targetY:innerHeight/2 - 40,

    targetScale:1,
    targetSpacing:160
};

let mouseX = innerWidth/2;
let mouseY = innerHeight/2;

/* =========================
   EYE CLASS
========================= */

class Eye{

    constructor(x,y){

        this.x = x;
        this.y = y;

        this.scale = 1;

        this.baseRadius =
        Math.min(innerWidth,innerHeight)*0.12;

        this.radius =
        this.baseRadius;

        this.irisX = 0;
        this.irisY = 0;

        this.targetX = 0;
        this.targetY = 0;

        this.micro = 0;

        this.blink = 0;
    }

    update(mx,my){

        this.radius =
        Math.max(
            6,
            this.baseRadius * this.scale
        );

        const dx = mx - this.x;
        const dy = my - this.y;

        const angle =
        Math.atan2(dy,dx);

        const dist =
        Math.min(
            this.radius*0.18,
            Math.hypot(dx,dy)*0.03
        );

        this.targetX =
        Math.cos(angle)*dist;

        this.targetY =
        Math.sin(angle)*dist;

        this.micro += 0.04;

        const jitterX =
        Math.sin(this.micro*3.2)*0.5;

        const jitterY =
        Math.cos(this.micro*2.8)*0.5;

        this.irisX +=
        ((this.targetX+jitterX)-this.irisX)*0.12;

        this.irisY +=
        ((this.targetY+jitterY)-this.irisY)*0.12;
    }

    draw(){

        ctx.save();

        ctx.translate(this.x,this.y);

        /* EYE SHAPE */

        ctx.beginPath();

        ctx.moveTo(-this.radius,0);

        ctx.quadraticCurveTo(
            0,
            -this.radius*0.72,
            this.radius,
            0
        );

        ctx.quadraticCurveTo(
            0,
            this.radius*0.72,
            -this.radius,
            0
        );

        ctx.closePath();

        ctx.clip();

        /* SCLERA */

        const sclera =
        ctx.createRadialGradient(
            0,
            -this.radius*0.2,
            5,
            0,
            0,
            this.radius
        );

        sclera.addColorStop(0,'#fff');
        sclera.addColorStop(.45,'#ececec');
        sclera.addColorStop(.8,'#bdbdbd');
        sclera.addColorStop(1,'#8c8c8c');

        ctx.fillStyle = sclera;

        ctx.fillRect(
            -this.radius,
            -this.radius,
            this.radius*2,
            this.radius*2
        );

        /* IRIS */

        const irisR =
        this.radius*0.42;

        const iris =
        ctx.createRadialGradient(
            this.irisX,
            this.irisY,
            5,
            this.irisX,
            this.irisY,
            irisR
        );

        iris.addColorStop(0,'#e9ffff');
        iris.addColorStop(.2,'#91f7ff');
        iris.addColorStop(.35,'#44d0ff');
        iris.addColorStop(.7,'#114868');
        iris.addColorStop(1,'#000');

        ctx.beginPath();

        ctx.arc(
            this.irisX,
            this.irisY,
            irisR,
            0,
            Math.PI*2
        );

        ctx.fillStyle = iris;
        ctx.fill();

        /* IRIS DETAILS */

        for(let i=0;i<70;i++){

            const a =
            (Math.PI*2/70)*i;

            const len =
            irisR*(0.65+Math.random()*0.3);

            ctx.beginPath();

            ctx.moveTo(
                this.irisX,
                this.irisY
            );

            ctx.lineTo(
                this.irisX +
                Math.cos(a)*len,

                this.irisY +
                Math.sin(a)*len
            );

            ctx.strokeStyle =
            'rgba(255,255,255,.06)';

            ctx.lineWidth = 1;

            ctx.stroke();
        }

        /* PUPIL */

        ctx.beginPath();

        ctx.arc(
            this.irisX,
            this.irisY,
            irisR*0.22,
            0,
            Math.PI*2
        );

        ctx.fillStyle = '#000';

        ctx.shadowBlur = 20;
        ctx.shadowColor = 'black';

        ctx.fill();

        ctx.shadowBlur = 0;

        /* GLOSS */

        const gloss =
        ctx.createRadialGradient(
            this.irisX-irisR*0.25,
            this.irisY-irisR*0.25,
            2,
            this.irisX,
            this.irisY,
            irisR
        );

        gloss.addColorStop(0,'rgba(255,255,255,.9)');
        gloss.addColorStop(.3,'rgba(255,255,255,.2)');
        gloss.addColorStop(1,'rgba(255,255,255,0)');

        ctx.beginPath();

        ctx.arc(
            this.irisX,
            this.irisY,
            irisR,
            0,
            Math.PI*2
        );

        ctx.fillStyle = gloss;
        ctx.fill();

        /* HIGHLIGHT */

        ctx.beginPath();

        ctx.arc(
            this.irisX-irisR*0.22,
            this.irisY-irisR*0.22,
            irisR*0.08,
            0,
            Math.PI*2
        );

        ctx.fillStyle =
        'rgba(255,255,255,.95)';

        ctx.fill();

        /* BLINK */

        if(this.blink > 0){

            ctx.fillStyle = '#05070c';

            const close =
            this.radius*1.6*this.blink;

            ctx.fillRect(
                -this.radius*1.3,
                -this.radius,
                this.radius*2.6,
                close
            );

            ctx.fillRect(
                -this.radius*1.3,
                this.radius-close,
                this.radius*2.6,
                close
            );
        }

        ctx.restore();
    }
}

/* =========================
   CREATE EYES
========================= */

const leftEye =
new Eye(
    innerWidth/2 - 160,
    innerHeight/2
);

const rightEye =
new Eye(
    innerWidth/2 + 160,
    innerHeight/2
);

/* =========================
   POINTER
========================= */

window.addEventListener('mousemove',e=>{

    mouseX = e.clientX;
    mouseY = e.clientY;
});

/* =========================
   BLINK
========================= */

function blink(){

    let t = 0;

    const anim = setInterval(()=>{

        t += 0.12;

        const v =
        Math.sin(t*Math.PI);

        leftEye.blink = v;
        rightEye.blink = v;

        if(t >= 1){

            leftEye.blink = 0;
            rightEye.blink = 0;

            clearInterval(anim);
        }

    },16);
}

setInterval(()=>{

    blink();

},3500 + Math.random()*2500);

/* =========================
   EYE LAYOUT
========================= */

function updateEyeLayout(){

    eyeState.x +=
    (eyeState.targetX-eyeState.x)*0.08;

    eyeState.y +=
    (eyeState.targetY-eyeState.y)*0.08;

    eyeState.scale +=
    (eyeState.targetScale-eyeState.scale)*0.08;

    eyeState.spacing +=
    (eyeState.targetSpacing-eyeState.spacing)*0.08;

    leftEye.x =
    eyeState.x-eyeState.spacing;

    rightEye.x =
    eyeState.x+eyeState.spacing;

    leftEye.y =
    eyeState.y;

    rightEye.y =
    eyeState.y;

    leftEye.scale =
    eyeState.scale;

    rightEye.scale =
    eyeState.scale;
}

/* =========================
   RENDER
========================= */

function render(){

    ctx.clearRect(0,0,w,h);

    updateEyeLayout();

    leftEye.update(mouseX,mouseY);
    rightEye.update(mouseX,mouseY);

    leftEye.draw();
    rightEye.draw();

    requestAnimationFrame(render);
}

render();

/* =========================
   UI
========================= */

const tabs =
document.querySelectorAll('.tab');

const logo =
document.getElementById('logo');

const slogan =
document.getElementById('slogan');

const topBar =
document.getElementById('topBar');

const content =
document.getElementById('content');

function setTab(tab){

    tabs.forEach(btn=>{

        btn.classList.remove('active');

        if(btn.dataset.tab === tab){

            btn.classList.add('active');
        }
    });

    /* =========================
       HOME
    ========================= */

    if(tab === 'home'){

        logo.classList.remove('hidden');
        slogan.classList.remove('hidden');

        topBar.classList.add('hidden');
        content.classList.add('hidden');

        eyeState.targetX =
        innerWidth/2;

        eyeState.targetY =
        innerHeight/2 - 40;

        eyeState.targetScale = 1;

        eyeState.targetSpacing = 105;

        return;
    }

    /* =========================
       OTHER TABS
    ========================= */

    logo.classList.add('hidden');
    slogan.classList.add('hidden');

    topBar.classList.remove('hidden');
    content.classList.remove('hidden');

    /* =========================
       FIXED EYES POSITION
    ========================= */

    const userRect =
    document.querySelector('.user')
    .getBoundingClientRect();

    eyeState.targetX =
    innerWidth / 2;

    eyeState.targetY =
    innerHeight / 2 - 240;

    /* маленькие глаза */

    eyeState.targetScale = 0.32;

    /* расстояние между ними */

    eyeState.targetSpacing = 33;

    /* =========================
       CONTENT
    ========================= */

    if(tab === 'profile'){

        content.innerHTML = `
        <div class="card">
            <h2>👤 ПРОФИЛЬ</h2>
            <br>
            <div>Социальный рейтинг: 12 500</div>
            <div>Статус: Достойный гражданин</div>
        </div>`;
    }

    else if(tab === 'bank'){

        content.innerHTML = `
        <div class="card">
            <h2>🏦 К-БАНК</h2>
            <br>
            <div>Доступный кредит: 4 000 кр.</div>
        </div>`;
    }

    else if(tab === 'darknet'){

        content.innerHTML = `
        <div class="card">
            <h2>🕶️ DARKNET</h2>
            <br>
            <div>Теневой рынок активен</div>
        </div>`;
    }

    else if(tab === 'court'){

        content.innerHTML = `
        <div class="card">
            <h2>⚖️ СУД</h2>
            <br>
            <div>Активных исков: 4</div>
        </div>`;
    }

    else if(tab === 'housing'){

        content.innerHTML = `
        <div class="card">
            <h2>🏙️ ЖИЛЬЁ</h2>
            <br>
            <div>Крабхэттен • сектор A</div>
        </div>`;
    }
}

/* =========================
   TAB EVENTS
========================= */

tabs.forEach(btn=>{

    btn.addEventListener('click',()=>{

        setTab(btn.dataset.tab);
    });
});

/* старт */

setTab('home');

</script>
</body>
</html>
