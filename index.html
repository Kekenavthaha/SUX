<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SUX — эфирная связь</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            overflow: hidden;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: #eef4ff;
        }

        /* ========== АНИМИРОВАННЫЙ ГРАДИЕНТНЫЙ ФОН ========== */
        .animated-bg {
            position: fixed;
            inset: 0;
            background: linear-gradient(125deg, #0f1a2f, #1b2c4a, #14223a, #0e1830);
            background-size: 300% 300%;
            animation: gradientFlow 18s ease infinite alternate;
            z-index: 0;
        }

        @keyframes gradientFlow {
            0% {
                background-position: 0% 50%;
                background: radial-gradient(circle at 30% 20%, #0a1128, #16213e);
            }
            25% {
                background: radial-gradient(circle at 70% 40%, #132a4a, #0d1b33);
            }
            50% {
                background: radial-gradient(circle at 40% 70%, #1c3050, #0f1a2f);
            }
            75% {
                background: radial-gradient(circle at 80% 60%, #162b48, #0b1428);
            }
            100% {
                background: radial-gradient(circle at 20% 80%, #0a1a30, #111d38);
            }
        }

        /* можно также плавно менять радиальный градиент, но для плавности используем только позиционирование */
        /* упростим: просто линейный градиент с движением */
        .gradient-layer {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #0e1a2a, #192f4a, #0c1a30, #1e3a5a);
            background-size: 400% 400%;
            animation: smoothGradient 22s ease infinite alternate;
            z-index: 0;
            opacity: 0.9;
        }

        @keyframes smoothGradient {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 100%; }
            100% { background-position: 0% 0%; }
        }

        /* дополнительное свечение (опционально) */
        .glow {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(80, 120, 255, 0.12), transparent 70%);
            pointer-events: none;
            z-index: 1;
        }

        /* Vignette для мягкого затемнения краёв */
        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.35) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* ========== SPLASH (5 сек) ========== */
        .splash {
            position: fixed;
            inset: 0;
            background: #0a0f1c;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease;
        }
        .splash.hide {
            opacity: 0;
            pointer-events: none;
        }
        .splash-logo {
            font-size: 86px;
            font-weight: 700;
            font-family: monospace;
            letter-spacing: 12px;
            background: linear-gradient(135deg, #bcd0ff, #6a8eff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: softPulse 1.4s infinite alternate;
        }
        .splash-title {
            margin-top: 20px;
            font-size: 15px;
            letter-spacing: 3px;
            color: #8aa9ff;
        }
        @keyframes softPulse {
            0% { opacity: 0.5; transform: scale(0.98); text-shadow: 0 0 5px #5a7eff; }
            100% { opacity: 1; transform: scale(1.01); text-shadow: 0 0 20px #5a7eff; }
        }

        /* ========== ЛОГОТИП И СЛОГАН (только на главной) ========== */
        .logo {
            position: fixed;
            bottom: 12%;
            width: 100%;
            text-align: center;
            font-size: clamp(42px, 10vw, 82px);
            font-weight: 700;
            font-family: monospace;
            letter-spacing: 8px;
            background: linear-gradient(135deg, #eef4ff, #bdd4ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 15px rgba(0,0,0,0.2);
            z-index: 5;
            transition: opacity 0.25s;
        }
        .slogan {
            position: fixed;
            width: 100%;
            bottom: 6%;
            text-align: center;
            color: #8aa9ff;
            letter-spacing: 2px;
            font-size: 12px;
            font-weight: 300;
            z-index: 5;
            transition: opacity 0.25s;
        }
        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* ========== ВЕРХНЯЯ ПАНЕЛЬ ========== */
        .top-bar {
            position: fixed;
            top: 16px;
            left: 16px;
            right: 16px;
            background: rgba(18, 25, 45, 0.6);
            backdrop-filter: blur(24px);
            border-radius: 60px;
            border: 1px solid rgba(140, 170, 255, 0.3);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            transition: opacity 0.25s;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
        }
        .balance {
            background: rgba(0,0,0,0.3);
            border-radius: 40px;
            padding: 5px 16px;
            font-weight: 600;
            font-size: 17px;
            color: #ffde9e;
            border: 1px solid rgba(255,220,100,0.3);
        }
        .user {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        .avatar {
            width: 34px;
            height: 34px;
            background: linear-gradient(145deg, #4b6ef0, #2b4ad0);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        /* ========== ОБЛАСТЬ КОНТЕНТА ========== */
        .content {
            position: fixed;
            top: 90px;
            left: 16px;
            right: 16px;
            bottom: 100px;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(18px);
            border-radius: 36px;
            border: 1px solid rgba(140, 170, 255, 0.2);
            padding: 20px;
            overflow-y: auto;
            z-index: 10;
            transition: opacity 0.25s;
        }
        .card {
            background: rgba(30, 40, 65, 0.5);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(140, 170, 255, 0.2);
            backdrop-filter: blur(4px);
        }
        .card h2 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #cbdffc;
        }
        .card button {
            background: #3b5bdb;
            border: none;
            padding: 12px 16px;
            border-radius: 48px;
            color: white;
            font-weight: 600;
            margin-top: 14px;
            width: 100%;
            cursor: pointer;
            transition: 0.1s;
        }
        .card button:active {
            transform: scale(0.97);
            background: #2a46b0;
        }

        /* ========== НИЖНЕЕ МЕНЮ ========== */
        .bottom {
            position: fixed;
            bottom: 18px;
            left: 16px;
            right: 16px;
            background: rgba(18, 25, 45, 0.75);
            backdrop-filter: blur(28px);
            border-radius: 48px;
            padding: 8px 12px;
            border: 1px solid rgba(140, 170, 255, 0.35);
            z-index: 10;
        }
        .menu {
            display: flex;
            justify-content: space-around;
            gap: 4px;
        }
        .tab {
            flex: 1;
            background: transparent;
            border: none;
            color: rgba(220, 240, 255, 0.6);
            font-size: 20px;
            padding: 10px 0;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }
        .tab span {
            font-size: 13px;
            display: none;
        }
        .tab.active {
            background: rgba(75, 110, 240, 0.25);
            color: #b4c8ff;
        }
        @media (min-width: 500px) {
            .tab span { display: inline; }
            .tab { font-size: 16px; gap: 8px; }
        }
    </style>
</head>
<body>

<!-- Анимированный градиентный фон (высокое качество) -->
<div class="gradient-layer"></div>
<div class="glow"></div>
<div class="vignette"></div>

<!-- Splash -->
<div class="splash" id="splash">
    <div class="splash-logo">SUX</div>
    <div class="splash-title">ЗАРЯЖАЮ ЭФИР</div>
</div>

<!-- Логотип (виден только на главной) -->
<div class="logo" id="logo">SUX</div>
<div class="slogan" id="slogan">Присутствие • Поток • Гармония</div>

<!-- Верхняя панель (скрыта на главной) -->
<div class="top-bar hidden" id="topBar">
    <div class="user">
        <div class="avatar">🦀</div>
        <span>Краб Гражданин</span>
    </div>
    <div class="balance" id="balanceDisplay">12 500 кр.</div>
</div>

<!-- Область контента (скрыта на главной) -->
<div class="content hidden" id="content"></div>

<!-- Нижнее меню -->
<div class="bottom">
    <div class="menu">
        <button class="tab active" data-tab="home">🏠<span>Главная</span></button>
        <button class="tab" data-tab="profile">👤<span>Профиль</span></button>
        <button class="tab" data-tab="bank">🏦<span>Банк</span></button>
        <button class="tab" data-tab="darknet">🕶️<span>Даркнет</span></button>
        <button class="tab" data-tab="court">⚖️<span>Суд</span></button>
        <button class="tab" data-tab="housing">🏙️<span>Жильё</span></button>
    </div>
</div>

<script>
    // ========== UI ЛОГИКА ==========
    const tabs = document.querySelectorAll('.tab');
    const logo = document.getElementById('logo');
    const slogan = document.getElementById('slogan');
    const topBar = document.getElementById('topBar');
    const contentDiv = document.getElementById('content');
    const splash = document.getElementById('splash');
    const balanceSpan = document.getElementById('balanceDisplay');

    let currentBalance = 12500;
    function updateBalanceUI() {
        balanceSpan.innerText = currentBalance.toLocaleString() + ' кр.';
    }

    function renderContent(tab) {
        let html = '';
        if(tab === 'profile') {
            html = `<div class="card">
                        <h2>👤 ПРОФИЛЬ</h2>
                        <div>Социальный рейтинг: <strong>${currentBalance}</strong></div>
                        <div>Ранг: Достойный гражданин</div>
                        <div>Сообщений: 342</div>
                        <div>Эффекты: нет</div>
                        <button id="refreshBtn">Обновить</button>
                    </div>`;
        } else if(tab === 'bank') {
            html = `<div class="card"><h2>🏦 К-БАНК</h2><div>Кредиты: до 2000 кр.</div><div>Инвестиции: 4-15%</div><button>Взять кредит</button></div>`;
        } else if(tab === 'darknet') {
            html = `<div class="card"><h2>🕶️ ДАРКНЕТ</h2><div>Теневой кошелёк: 0 кр.</div><div>Грибы • Крабедрон</div><button>Перейти</button></div>`;
        } else if(tab === 'court') {
            html = `<div class="card"><h2>⚖️ СУД</h2><div>Активных исков: 0</div><button>Подать иск</button></div>`;
        } else if(tab === 'housing') {
            html = `<div class="card"><h2>🏙️ КРАБ-ЙОРК</h2><div>Крабхэттен • Студия от 3 млн</div><button>Выбрать жильё</button></div>`;
        }
        contentDiv.innerHTML = html;
        if(tab === 'profile') {
            document.getElementById('refreshBtn')?.addEventListener('click', () => {
                currentBalance += Math.floor(Math.random() * 500);
                updateBalanceUI();
                renderContent('profile');
            });
        }
    }

    function setActiveTab(tab) {
        tabs.forEach(btn => {
            btn.classList.remove('active');
            if(btn.dataset.tab === tab) btn.classList.add('active');
        });
        if(tab === 'home') {
            logo.classList.remove('hidden');
            slogan.classList.remove('hidden');
            topBar.classList.add('hidden');
            contentDiv.classList.add('hidden');
        } else {
            logo.classList.add('hidden');
            slogan.classList.add('hidden');
            topBar.classList.remove('hidden');
            contentDiv.classList.remove('hidden');
            renderContent(tab);
        }
    }

    tabs.forEach(btn => {
        btn.addEventListener('click', () => setActiveTab(btn.dataset.tab));
    });

    // Splash на 5 секунд
    setTimeout(() => {
        splash.classList.add('hide');
        setTimeout(() => { splash.style.display = 'none'; }, 800);
        setActiveTab('home');
        updateBalanceUI();
    }, 5000);
</script>
</body>
</html>
