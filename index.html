<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>SUX — eyes</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
}

body{
    min-height:100vh;
    overflow:hidden;
    background:#0a0c12;
    font-family:Segoe UI,sans-serif;
    color:white;
}

/* фон */

.animated-bg{
    position:fixed;
    inset:0;

    background:
    linear-gradient(
    135deg,
    #0a0f1a,
    #0d161f,
    #140c12,
    #0b1118);

    background-size:300% 300%;

    animation:bgFlow 12s ease infinite;

    z-index:0;
}

@keyframes bgFlow{
    0%{background-position:0% 0%;}
    50%{background-position:100% 100%;}
    100%{background-position:0% 0%;}
}

/* сетка */

.grid{
    position:fixed;
    inset:0;

    background-image:
    linear-gradient(rgba(255,50,50,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,50,50,.05) 1px, transparent 1px);

    background-size:40px 40px;

    z-index:1;
}

/* шум */

.noise{
    position:fixed;
    inset:0;

    opacity:.12;

    background-image:
    url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iLjgiIG51bU9jdGF2ZXM9IjIiLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWx0ZXI9InVybCgjbikiLz48L3N2Zz4=');

    z-index:1;
}

/* ---------- ГЛАЗА ---------- */

.eyes-wrapper{
    position:fixed;

    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    gap:7vw;

    transform:translateY(-10%);

    z-index:3;

    pointer-events:none;
}

.eye{
    position:relative;

    width:clamp(80px,6vw,120px);
    height:clamp(40px,3vw,62px);

    border-radius:100px / 70px;

    overflow:hidden;

    background:
    radial-gradient(circle at 50% 50%,
    #ffffff 0%,
    #f2f2f2 75%,
    #d2d2d2 100%);

    box-shadow:
    0 0 22px rgba(0,0,0,.45),
    inset 0 -3px 8px rgba(0,0,0,.2),
    inset 0 3px 5px rgba(255,255,255,.3);
}

/* верхнее веко */

.eye::before{
    content:"";

    position:absolute;

    top:-24%;
    left:-5%;

    width:110%;
    height:58%;

    background:#0a0c12;

    border-bottom-left-radius:100px;
    border-bottom-right-radius:100px;

    z-index:6;
}

/* нижнее веко */

.eye::after{
    content:"";

    position:absolute;

    bottom:-20%;
    left:-5%;

    width:110%;
    height:35%;

    background:#0a0c12;

    border-top-left-radius:100px;
    border-top-right-radius:100px;

    opacity:.8;

    z-index:6;
}

/* радужка */

.pupil{
    position:absolute;

    width:34%;
    height:62%;

    top:50%;
    left:50%;

    transform:translate(-50%, -50%);

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    radial-gradient(circle at 40% 40%,
    #79e8ff 0%,
    #3aa8ca 35%,
    #183848 75%,
    #000 100%);

    box-shadow:
    0 0 12px rgba(0,0,0,.5),
    inset 0 0 8px rgba(255,255,255,.25);

    transition:
    transform .09s cubic-bezier(.2,.9,.3,1.2);
}

/* зрачок */

.pupil::before{
    content:"";

    position:absolute;

    width:38%;
    height:38%;

    background:#000;

    border-radius:50%;
}

/* блик */

.pupil::after{
    content:"";

    position:absolute;

    width:16%;
    height:16%;

    top:22%;
    left:28%;

    border-radius:50%;

    background:white;

    filter:blur(1px);
}

/* веки */

.lid{
    position:absolute;

    inset:0;

    height:0%;

    background:
    linear-gradient(
    to bottom,
    #151b24,
    #06080d);

    border-radius:100px / 70px;

    z-index:20;

    transition:
    height .11s ease;
}

.eye.blink .lid{
    height:100%;
}

/* логотип */

.sux-brand{
    position:fixed;

    bottom:16%;
    left:0;
    right:0;

    text-align:center;

    font-size:clamp(40px,10vw,90px);

    font-weight:900;

    letter-spacing:10px;

    color:rgba(255,70,70,.7);

    text-shadow:
    0 0 20px rgba(255,0,0,.5);

    font-family:monospace;

    z-index:5;
}

/* слоган */

.slogan{
    position:fixed;

    bottom:9%;

    left:0;
    right:0;

    text-align:center;

    font-size:12px;

    color:rgba(255,220,220,.5);

    font-family:monospace;

    z-index:5;
}

/* кнопка */

.demo-button{
    position:fixed;

    right:20px;
    bottom:20px;

    border:none;

    padding:14px 24px;

    border-radius:40px;

    background:#b93333;

    color:white;

    font-weight:bold;

    cursor:pointer;

    z-index:10;

    transition:.12s;

    box-shadow:
    0 4px 18px rgba(0,0,0,.35);
}

.demo-button:active{
    transform:scale(.95);
}

</style>
</head>

<body>

<div class="animated-bg"></div>
<div class="grid"></div>
<div class="noise"></div>

<div class="eyes-wrapper">

    <div class="eye" id="leftEye">
        <div class="pupil" id="leftPupil"></div>
        <div class="lid"></div>
    </div>

    <div class="eye" id="rightEye">
        <div class="pupil" id="rightPupil"></div>
        <div class="lid"></div>
    </div>

</div>

<div class="sux-brand">SUX</div>
<div class="slogan">
и смотрит, и слушает, и помнит
</div>

<button class="demo-button" id="demoBtn">
👁 Нажми
</button>

<script>

(function(){

const leftEye = document.getElementById('leftEye');
const rightEye = document.getElementById('rightEye');

const leftPupil = document.getElementById('leftPupil');
const rightPupil = document.getElementById('rightPupil');

function getMaxOffset(eye){

    const eyeSize = eye.offsetWidth;

    const pupilRadius = eyeSize * 0.12;
    const eyeRadius = eyeSize * 0.5;

    return eyeRadius - pupilRadius - 3;
}

function calculateOffset(rect, x, y, max){

    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    const dx = x - centerX;
    const dy = y - centerY;

    const distance = Math.hypot(dx, dy);

    const angle = Math.atan2(dy, dx);

    const offset = Math.min(distance, max);

    return {
        x: Math.cos(angle) * offset,
        y: Math.sin(angle) * offset
    };
}

function updateEyes(x, y){

    const leftRect = leftEye.getBoundingClientRect();
    const rightRect = rightEye.getBoundingClientRect();

    const leftOffset =
    calculateOffset(
    leftRect,
    x,
    y,
    getMaxOffset(leftEye));

    const rightOffset =
    calculateOffset(
    rightRect,
    x,
    y,
    getMaxOffset(rightEye));

    leftPupil.style.transform =
    `translate(calc(-50% + ${leftOffset.x}px),
    calc(-50% + ${leftOffset.y}px))`;

    rightPupil.style.transform =
    `translate(calc(-50% + ${rightOffset.x}px),
    calc(-50% + ${rightOffset.y}px))`;
}

/* моргание */

function blink(){

    leftEye.classList.add('blink');
    rightEye.classList.add('blink');

    setTimeout(()=>{
        leftEye.classList.remove('blink');
        rightEye.classList.remove('blink');
    },140);
}

/* авто-моргание */

setInterval(()=>{
    blink();
}, 4000 + Math.random() * 3000);

/* мышка */

window.addEventListener('mousemove', e=>{
    updateEyes(e.clientX, e.clientY);
});

/* touch */

window.addEventListener('touchmove', e=>{

    if(e.touches.length){

        updateEyes(
        e.touches[0].clientX,
        e.touches[0].clientY);
    }
});

/* кнопка */

const btn = document.getElementById('demoBtn');

btn.addEventListener('click', ()=>{

    blink();

    if(navigator.vibrate){
        navigator.vibrate(50);
    }

    const old = btn.innerText;

    btn.innerText = '👁 зафиксировано';

    setTimeout(()=>{
        btn.innerText = old;
    },800);
});

console.log('SUX eyes active');

})();

</script>

</body>
</html>
