<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SUX — ваш безопасный мессенджер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            overflow: hidden;
            background: #0a0f1c;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #eef4ff;
        }

        /* ========== ФОН (глубокий тёмно-синий с мягким градиентом) ========== */
        .bg {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 30%, #0f172a, #030614);
            animation: slowBreath 12s infinite alternate;
        }
        @keyframes slowBreath {
            0% { opacity: 0.9; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.02); }
        }

        /* Лёгкая сетка (почти незаметная) */
        .grid {
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(100, 150, 255, 0.04) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(100, 150, 255, 0.04) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
        }

        /* Едва заметные сканы */
        .scanlines {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 1px, transparent 2px, transparent 4px);
            opacity: 0.3;
        }

        /* Vignette для глубины */
        .vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.4) 100%);
        }

        /* ========== SPLASH SCREEN (5 сек) ========== */
        .splash {
            position: fixed;
            inset: 0;
            background: #0a0f1c;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease;
        }
        .splash.hide {
            opacity: 0;
            pointer-events: none;
        }
        .splash-logo {
            font-size: 86px;
            font-weight: 800;
            font-family: monospace;
            letter-spacing: 12px;
            background: linear-gradient(135deg, #94b0ff, #6c8cff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: softPulse 1.4s infinite alternate;
        }
        .splash-title {
            margin-top: 20px;
            font-size: 15px;
            letter-spacing: 3px;
            color: #7f9cf5;
            font-weight: 300;
        }
        @keyframes softPulse {
            0% { opacity: 0.6; transform: scale(0.98); text-shadow: 0 0 5px #5a7eff; }
            100% { opacity: 1; transform: scale(1.01); text-shadow: 0 0 18px #5a7eff; }
        }

        /* ========== ВИЗУАЛИЗАТОР (вместо глаз) ========== */
        .visualizer-container {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 4;
            pointer-events: none;
        }
        canvas#vizualizer {
            width: 100%;
            height: 60%;
            max-width: 700px;
            filter: drop-shadow(0 0 20px rgba(80, 120, 255, 0.3));
        }

        /* ========== ЛОГОТИП И СЛОГАН (только на главной) ========== */
        .logo {
            position: fixed;
            bottom: 12%;
            width: 100%;
            text-align: center;
            font-size: clamp(42px, 10vw, 82px);
            font-weight: 700;
            font-family: monospace;
            letter-spacing: 8px;
            background: linear-gradient(135deg, #eef4ff, #bdd4ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            z-index: 5;
            transition: opacity 0.25s;
        }
        .slogan {
            position: fixed;
            width: 100%;
            bottom: 6%;
            text-align: center;
            color: #8aa9ff;
            letter-spacing: 2px;
            font-size: 12px;
            font-weight: 300;
            z-index: 5;
            transition: opacity 0.25s;
        }
        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* ========== ВЕРХНЯЯ ПАНЕЛЬ ========== */
        .top-bar {
            position: fixed;
            top: 16px;
            left: 16px;
            right: 16px;
            background: rgba(18, 25, 45, 0.65);
            backdrop-filter: blur(24px);
            border-radius: 60px;
            border: 1px solid rgba(140, 170, 255, 0.3);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            transition: opacity 0.25s;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
        }
        .balance {
            background: rgba(0,0,0,0.3);
            border-radius: 40px;
            padding: 5px 16px;
            font-weight: 600;
            font-size: 17px;
            color: #ffde9e;
            border: 1px solid rgba(255,220,100,0.3);
        }
        .user {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
        }
        .avatar {
            width: 34px;
            height: 34px;
            background: linear-gradient(145deg, #4b6ef0, #2b4ad0);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        /* ========== ОБЛАСТЬ КОНТЕНТА ========== */
        .content {
            position: fixed;
            top: 90px;
            left: 16px;
            right: 16px;
            bottom: 100px;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(18px);
            border-radius: 36px;
            border: 1px solid rgba(140, 170, 255, 0.2);
            padding: 20px;
            overflow-y: auto;
            z-index: 10;
            transition: opacity 0.25s;
            scrollbar-width: thin;
        }
        .card {
            background: rgba(30, 40, 65, 0.5);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(140, 170, 255, 0.2);
            backdrop-filter: blur(4px);
        }
        .card h2 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #cbdffc;
            font-weight: 500;
        }
        .card button {
            background: #3b5bdb;
            border: none;
            padding: 12px 16px;
            border-radius: 48px;
            color: white;
            font-weight: 600;
            margin-top: 14px;
            width: 100%;
            cursor: pointer;
            transition: 0.1s;
            font-size: 15px;
        }
        .card button:active {
            transform: scale(0.97);
            background: #2a46b0;
        }

        /* ========== НИЖНЕЕ МЕНЮ ========== */
        .bottom {
            position: fixed;
            bottom: 18px;
            left: 16px;
            right: 16px;
            background: rgba(18, 25, 45, 0.75);
            backdrop-filter: blur(28px);
            border-radius: 48px;
            padding: 8px 12px;
            border: 1px solid rgba(140, 170, 255, 0.35);
            z-index: 10;
        }
        .menu {
            display: flex;
            justify-content: space-around;
            gap: 4px;
        }
        .tab {
            flex: 1;
            background: transparent;
            border: none;
            color: rgba(220, 240, 255, 0.6);
            font-size: 20px;
            padding: 10px 0;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }
        .tab span {
            font-size: 13px;
            display: none;
        }
        .tab.active {
            background: rgba(75, 110, 240, 0.25);
            color: #b4c8ff;
            text-shadow: 0 0 8px rgba(100, 150, 255, 0.3);
        }
        @media (min-width: 500px) {
            .tab span { display: inline; }
            .tab { font-size: 16px; gap: 8px; }
        }
    </style>
</head>
<body>

<!-- Фоновые слои -->
<div class="bg"></div>
<div class="grid"></div>
<div class="scanlines"></div>
<div class="vignette"></div>

<!-- SPLASH (5 сек) -->
<div class="splash" id="splash">
    <div class="splash-logo">SUX</div>
    <div class="splash-title">СВЯЗЬ БЕЗ ГРАНИЦ</div>
</div>

<!-- ВИЗУАЛИЗАТОР (на главной) -->
<div class="visualizer-container">
    <canvas id="vizualizer" width="800" height="400"></canvas>
</div>

<div class="logo" id="logo">SUX</div>
<div class="slogan" id="slogan">Слушай • Общайся • Доверяй</div>

<div class="top-bar hidden" id="topBar">
    <div class="user">
        <div class="avatar">🦀</div>
        <span>Краб Гражданин</span>
    </div>
    <div class="balance" id="balanceDisplay">12 500 кр.</div>
</div>

<div class="content hidden" id="content"></div>

<div class="bottom">
    <div class="menu">
        <button class="tab active" data-tab="home">🏠<span>Главная</span></button>
        <button class="tab" data-tab="profile">👤<span>Профиль</span></button>
        <button class="tab" data-tab="bank">🏦<span>Банк</span></button>
        <button class="tab" data-tab="darknet">🕶️<span>Даркнет</span></button>
        <button class="tab" data-tab="court">⚖️<span>Суд</span></button>
        <button class="tab" data-tab="housing">🏙️<span>Жильё</span></button>
    </div>
</div>

<script>
    // ========== ВИЗУАЛИЗАТОР (плавные волны / мягкие бары) ==========
    const canvasViz = document.getElementById('vizualizer');
    const ctxViz = canvasViz.getContext('2d');
    let width, height;
    let bars = [];
    const barCount = 48;
    let animationFrameViz;

    function resizeViz() {
        const container = canvasViz.parentElement;
        const maxWidth = Math.min(window.innerWidth, 700);
        canvasViz.style.width = `${maxWidth}px`;
        canvasViz.style.height = `auto`;
        canvasViz.width = 800;
        canvasViz.height = 400;
        width = canvasViz.width;
        height = canvasViz.height;
        // инициализация баров
        bars = Array(barCount).fill(0).map(() => ({
            target: 0.2 + Math.random() * 0.3,
            current: 0.2 + Math.random() * 0.3
        }));
    }
    resizeViz();
    window.addEventListener('resize', resizeViz);

    function updateVisualizer() {
        // плавно меняем цели (имитация музыки, но более размеренная)
        for (let i = 0; i < barCount; i++) {
            // случайные колебания с плавностью
            const r = Math.random();
            if (r < 0.05) {
                bars[i].target = 0.15 + Math.random() * 0.7;
            }
            bars[i].current += (bars[i].target - bars[i].current) * 0.08;
        }
    }

    function drawVisualizer() {
        if (!ctxViz) return;
        ctxViz.clearRect(0, 0, width, height);
        
        const barWidth = width / barCount;
        const centerY = height / 2;
        
        for (let i = 0; i < barCount; i++) {
            const h = bars[i].current * (height * 0.35);
            const x = i * barWidth;
            const yTop = centerY - h;
            const yBottom = centerY;
            
            // градиент для баров — мягкий, бирюзово-синий
            const grad = ctxViz.createLinearGradient(x, yTop, x, yBottom);
            grad.addColorStop(0, '#7aa2f7');
            grad.addColorStop(1, '#3b82f6');
            ctxViz.fillStyle = grad;
            ctxViz.fillRect(x + 1, yTop, barWidth - 2, h);
            
            // отражение вниз (зеркально)
            const gradDown = ctxViz.createLinearGradient(x, centerY, x, centerY + h);
            gradDown.addColorStop(0, '#3b82f6');
            gradDown.addColorStop(1, '#1e3a8a');
            ctxViz.fillStyle = gradDown;
            ctxViz.fillRect(x + 1, centerY, barWidth - 2, h);
            
            // мягкое свечение
            ctxViz.shadowBlur = 6;
            ctxViz.shadowColor = '#5a8eff';
        }
        ctxViz.shadowBlur = 0;
        
        // центральная линия
        ctxViz.beginPath();
        ctxViz.moveTo(0, centerY);
        ctxViz.lineTo(width, centerY);
        ctxViz.strokeStyle = 'rgba(100, 150, 255, 0.35)';
        ctxViz.lineWidth = 1.5;
        ctxViz.stroke();
        
        // плавающие точки (звёздочки)
        for (let i = 0; i < 30; i++) {
            if (Math.random() < 0.05) {
                ctxViz.fillStyle = `rgba(180, 210, 255, ${0.2 + Math.random() * 0.3})`;
                ctxViz.beginPath();
                ctxViz.arc(Math.random() * width, Math.random() * height, 1.5, 0, Math.PI * 2);
                ctxViz.fill();
            }
        }
    }
    
    function animateViz() {
        updateVisualizer();
        drawVisualizer();
        requestAnimationFrame(animateViz);
    }
    animateViz();

    // ========== UI ЛОГИКА (без глаз, с визуализатором на главной) ==========
    const tabs = document.querySelectorAll('.tab');
    const logo = document.getElementById('logo');
    const slogan = document.getElementById('slogan');
    const topBar = document.getElementById('topBar');
    const contentDiv = document.getElementById('content');
    const splash = document.getElementById('splash');
    const balanceSpan = document.getElementById('balanceDisplay');
    const vizContainer = document.querySelector('.visualizer-container');
    
    let currentBalance = 12500;
    function updateBalanceUI() {
        balanceSpan.innerText = currentBalance.toLocaleString() + ' кр.';
    }
    
    function renderContent(tab) {
        let html = '';
        if(tab === 'profile') {
            html = `<div class="card">
                        <h2>👤 ПРОФИЛЬ</h2>
                        <div>Социальный рейтинг: <strong>${currentBalance}</strong></div>
                        <div>Ранг: Достойный гражданин</div>
                        <div>Сообщений: 342</div>
                        <div>Эффекты: нет</div>
                        <button id="refreshBtn">Обновить</button>
                    </div>`;
        } else if(tab === 'bank') {
            html = `<div class="card"><h2>🏦 К-БАНК</h2><div>Кредиты: до 2000 кр.</div><div>Инвестиции: 4-15%</div><button>Взять кредит</button></div>`;
        } else if(tab === 'darknet') {
            html = `<div class="card"><h2>🕶️ ДАРКНЕТ</h2><div>Теневой кошелёк: 0 кр.</div><div>Грибы • Крабедрон</div><button>Перейти</button></div>`;
        } else if(tab === 'court') {
            html = `<div class="card"><h2>⚖️ СУД</h2><div>Активных исков: 0</div><button>Подать иск</button></div>`;
        } else if(tab === 'housing') {
            html = `<div class="card"><h2>🏙️ КРАБ-ЙОРК</h2><div>Крабхэттен • Студия от 3 млн</div><button>Выбрать жильё</button></div>`;
        }
        contentDiv.innerHTML = html;
        if(tab === 'profile') {
            document.getElementById('refreshBtn')?.addEventListener('click', () => {
                currentBalance += Math.floor(Math.random() * 500);
                updateBalanceUI();
                renderContent('profile');
            });
        }
    }
    
    function setActiveTab(tab) {
        tabs.forEach(btn => {
            btn.classList.remove('active');
            if(btn.dataset.tab === tab) btn.classList.add('active');
        });
        if(tab === 'home') {
            // главная: показываем визуализатор, лого, слоган; скрываем верхнюю панель и контент
            vizContainer.style.display = 'flex';
            logo.classList.remove('hidden');
            slogan.classList.remove('hidden');
            topBar.classList.add('hidden');
            contentDiv.classList.add('hidden');
        } else {
            // другие вкладки: скрываем визуализатор, лого; показываем панель и контент
            vizContainer.style.display = 'none';
            logo.classList.add('hidden');
            slogan.classList.add('hidden');
            topBar.classList.remove('hidden');
            contentDiv.classList.remove('hidden');
            renderContent(tab);
        }
    }
    
    tabs.forEach(btn => {
        btn.addEventListener('click', () => setActiveTab(btn.dataset.tab));
    });
    
    // Splash на 5 секунд
    setTimeout(() => {
        splash.classList.add('hide');
        setTimeout(() => { splash.style.display = 'none'; }, 800);
        setActiveTab('home');
        updateBalanceUI();
    }, 5000);
</script>
</body>
</html>
