<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SUX — следит всегда</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            overflow: hidden;
            background: #05070c;
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            color: #fff;
        }

        /* ========== Фоновые слои ========== */
        .bg {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at top left, rgba(212, 175, 55, 0.12), transparent 40%),
                        radial-gradient(circle at bottom right, rgba(207, 60, 60, 0.08), transparent 45%),
                        linear-gradient(135deg, #05070c 0%, #0a0f1a 50%, #070b10 100%);
            animation: bgFlow 18s ease infinite alternate;
        }
        @keyframes bgFlow {
            0% { filter: hue-rotate(0deg) brightness(1); transform: scale(1); }
            100% { filter: hue-rotate(8deg) brightness(1.08); transform: scale(1.02); }
        }

        .grid {
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(212, 175, 55, 0.08) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(212, 175, 55, 0.08) 1px, transparent 1px);
            background-size: 42px 42px;
            opacity: 0.6;
            pointer-events: none;
        }

        .scanlines {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 2px, transparent 4px);
            mix-blend-mode: soft-light;
            opacity: 0.3;
        }

        .vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle, transparent 55%, rgba(0,0,0,0.6) 100%);
        }

        /* ========== SPLASH SCREEN ========== */
        .splash {
            position: fixed;
            inset: 0;
            background: #05070c;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease;
            backdrop-filter: blur(0px);
        }
        .splash.hide {
            opacity: 0;
            pointer-events: none;
        }
        .splash-logo {
            font-size: 96px;
            font-weight: 900;
            font-family: monospace;
            letter-spacing: 16px;
            color: rgba(255, 70, 70, 0.9);
            text-shadow: 0 0 30px rgba(255,0,0,0.5);
            animation: pulse 1.2s infinite alternate;
        }
        .splash-title {
            margin-top: 24px;
            font-size: 18px;
            letter-spacing: 4px;
            color: rgba(212,175,55,0.7);
        }
        @keyframes pulse {
            0% { opacity: 0.6; transform: scale(0.98); text-shadow: 0 0 10px red; }
            100% { opacity: 1; transform: scale(1.02); text-shadow: 0 0 35px #ff4444; }
        }

        /* ========== КИНО-ГЛАЗА (canvas) ========== */
        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            pointer-events: none;
        }

        /* ========== ЛОГОТИП И СЛОГАН (только на главной) ========== */
        .logo {
            position: fixed;
            bottom: 14%;
            width: 100%;
            text-align: center;
            font-size: clamp(48px, 12vw, 96px);
            font-weight: 900;
            font-family: monospace;
            letter-spacing: 8px;
            color: rgba(255, 70, 70, 0.85);
            text-shadow: 0 0 12px rgba(255,0,0,0.5), 0 0 32px rgba(255,0,0,0.3);
            z-index: 5;
            transition: opacity 0.25s;
        }
        .slogan {
            position: fixed;
            width: 100%;
            bottom: 8%;
            text-align: center;
            color: rgba(212,175,55,0.6);
            letter-spacing: 3px;
            font-size: 11px;
            font-weight: 300;
            z-index: 5;
            transition: opacity 0.25s;
        }
        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* ========== ВЕРХНЯЯ ПАНЕЛЬ (баланс) ========== */
        .top-bar {
            position: fixed;
            top: 16px;
            left: 16px;
            right: 16px;
            background: rgba(10, 15, 25, 0.65);
            backdrop-filter: blur(20px);
            border-radius: 60px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            transition: opacity 0.25s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .balance {
            background: rgba(0,0,0,0.5);
            border-radius: 40px;
            padding: 6px 18px;
            font-weight: bold;
            font-size: 18px;
            color: #ffd966;
            border: 1px solid rgba(255,217,102,0.3);
        }
        .user {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        .avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(145deg, #b33, #8a2020);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 8px rgba(255,80,80,0.5);
        }

        /* ========== ОБЛАСТЬ КОНТЕНТА ========== */
        .content {
            position: fixed;
            top: 90px;
            left: 16px;
            right: 16px;
            bottom: 100px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            border: 1px solid rgba(212, 175, 55, 0.25);
            padding: 20px;
            overflow-y: auto;
            z-index: 10;
            transition: opacity 0.25s;
            scrollbar-width: thin;
        }
        .card {
            background: rgba(30, 30, 50, 0.55);
            border-radius: 24px;
            padding: 18px;
            margin-bottom: 16px;
            border: 1px solid rgba(212,175,55,0.2);
            backdrop-filter: blur(4px);
            transition: transform 0.1s;
        }
        .card h2 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #ffaa88;
        }
        .card button {
            background: #cf3c3c;
            border: none;
            padding: 10px 16px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            margin-top: 12px;
            width: 100%;
            cursor: pointer;
            transition: 0.1s;
        }
        .card button:active {
            transform: scale(0.97);
        }

        /* ========== НИЖНЕЕ МЕНЮ ========== */
        .bottom {
            position: fixed;
            bottom: 18px;
            left: 16px;
            right: 16px;
            background: rgba(10, 15, 25, 0.75);
            backdrop-filter: blur(24px);
            border-radius: 48px;
            padding: 8px 12px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            z-index: 10;
        }
        .menu {
            display: flex;
            justify-content: space-around;
            gap: 4px;
        }
        .tab {
            flex: 1;
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.6);
            font-size: 20px;
            padding: 10px 0;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }
        .tab span {
            font-size: 13px;
            display: none;
        }
        .tab.active {
            background: rgba(207, 60, 60, 0.25);
            color: #ff6b6b;
            text-shadow: 0 0 6px rgba(255,0,0,0.5);
        }
        @media (min-width: 500px) {
            .tab span { display: inline; }
            .tab { font-size: 16px; gap: 8px; }
        }
    </style>
</head>
<body>

<!-- Фоновые эффекты -->
<div class="bg"></div>
<div class="grid"></div>
<div class="scanlines"></div>
<div class="vignette"></div>

<!-- SPLASH SCREEN -->
<div class="splash" id="splash">
    <div class="splash-logo">SUX</div>
    <div class="splash-title">ИДЕНТИФИКАЦИЯ СЕТИ</div>
</div>

<canvas id="eyeCanvas"></canvas>

<div class="logo" id="logo">SUX</div>
<div class="slogan" id="slogan">ВИЖУ • СЛЫШУ • ЗАПОМИНАЮ</div>

<div class="top-bar hidden" id="topBar">
    <div class="user">
        <div class="avatar">🦀</div>
        <span>Краб Гражданин</span>
    </div>
    <div class="balance" id="balanceDisplay">12 500 кр.</div>
</div>

<div class="content hidden" id="content"></div>

<div class="bottom">
    <div class="menu">
        <button class="tab active" data-tab="home">🏠<span>Главная</span></button>
        <button class="tab" data-tab="profile">👤<span>Профиль</span></button>
        <button class="tab" data-tab="bank">🏦<span>Банк</span></button>
        <button class="tab" data-tab="darknet">🕶️<span>Даркнет</span></button>
        <button class="tab" data-tab="court">⚖️<span>Суд</span></button>
        <button class="tab" data-tab="housing">🏙️<span>Жильё</span></button>
    </div>
</div>

<script>
    // ======================== КИНО-ГЛАЗА ========================
    const canvas = document.getElementById('eyeCanvas');
    const ctx = canvas.getContext('2d');
    let w, h;

    function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // Класс глаза (реалистичный)
    class Eye {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.baseRadius = Math.min(w, h) * 0.12;
            this.radius = this.baseRadius;
            this.irisX = 0; this.irisY = 0;
            this.targetX = 0; this.targetY = 0;
            this.blink = 0;
            this.micro = 0;
            this.scale = 1;
        }
        update(mx, my, scaleFactor = 1) {
            this.radius = this.baseRadius * scaleFactor;
            const dx = mx - this.x;
            const dy = my - this.y;
            const angle = Math.atan2(dy, dx);
            const maxDist = this.radius * 0.22;
            const dist = Math.min(maxDist, Math.hypot(dx, dy) * 0.035);
            this.targetX = Math.cos(angle) * dist;
            this.targetY = Math.sin(angle) * dist;
            this.micro += 0.04;
            const jx = Math.sin(this.micro * 3.2) * 0.5;
            const jy = Math.cos(this.micro * 2.8) * 0.5;
            this.irisX += ((this.targetX + jx) - this.irisX) * 0.12;
            this.irisY += ((this.targetY + jy) - this.irisY) * 0.12;
        }
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            // форма глаза
            ctx.beginPath();
            ctx.moveTo(-this.radius, 0);
            ctx.quadraticCurveTo(0, -this.radius * 0.72, this.radius, 0);
            ctx.quadraticCurveTo(0, this.radius * 0.72, -this.radius, 0);
            ctx.closePath();
            ctx.clip();
            // склера
            const sclera = ctx.createRadialGradient(0, -this.radius*0.2, 5, 0, 0, this.radius);
            sclera.addColorStop(0, '#ffffff');
            sclera.addColorStop(0.45, '#f5f5f5');
            sclera.addColorStop(0.8, '#cfcfcf');
            sclera.addColorStop(1, '#a0a0a0');
            ctx.fillStyle = sclera;
            ctx.fillRect(-this.radius, -this.radius, this.radius*2, this.radius*2);
            // прожилки
            for(let i=0;i<22;i++) {
                ctx.beginPath();
                const vx = (Math.random() - 0.5)*this.radius*1.4;
                const vy = (Math.random() - 0.5)*this.radius*1.1;
                ctx.moveTo(vx, vy);
                ctx.quadraticCurveTo(vx+Math.random()*18, vy+Math.random()*18, vx+Math.random()*35, vy+Math.random()*18);
                ctx.strokeStyle = `rgba(180,70,70,0.05)`;
                ctx.lineWidth = 1.2;
                ctx.stroke();
            }
            // радужка
            const irisR = this.radius * 0.42;
            const irisGrad = ctx.createRadialGradient(this.irisX, this.irisY, 5, this.irisX, this.irisY, irisR);
            irisGrad.addColorStop(0, '#f0ffff');
            irisGrad.addColorStop(0.15, '#a2f0ff');
            irisGrad.addColorStop(0.35, '#48c8ff');
            irisGrad.addColorStop(0.65, '#146da1');
            irisGrad.addColorStop(0.9, '#07253d');
            irisGrad.addColorStop(1, '#000000');
            ctx.beginPath();
            ctx.arc(this.irisX, this.irisY, irisR, 0, Math.PI*2);
            ctx.fillStyle = irisGrad;
            ctx.fill();
            // нити радужки
            for(let i=0;i<90;i++) {
                const a = (Math.PI*2/90)*i;
                const len = irisR * (0.65 + Math.random()*0.35);
                ctx.beginPath();
                ctx.moveTo(this.irisX, this.irisY);
                ctx.lineTo(this.irisX + Math.cos(a)*len, this.irisY + Math.sin(a)*len);
                ctx.strokeStyle = `rgba(255,255,255,0.05)`;
                ctx.lineWidth = 1;
                ctx.stroke();
            }
            // зрачок
            ctx.beginPath();
            ctx.arc(this.irisX, this.irisY, irisR*0.23, 0, Math.PI*2);
            ctx.fillStyle = '#000';
            ctx.shadowBlur = 20; ctx.shadowColor = 'black';
            ctx.fill();
            ctx.shadowBlur = 0;
            // блики
            const gloss = ctx.createRadialGradient(this.irisX-irisR*0.25, this.irisY-irisR*0.25, 3, this.irisX, this.irisY, irisR);
            gloss.addColorStop(0, 'rgba(255,255,255,0.95)');
            gloss.addColorStop(0.3, 'rgba(255,255,255,0.2)');
            gloss.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.beginPath();
            ctx.arc(this.irisX, this.irisY, irisR, 0, Math.PI*2);
            ctx.fillStyle = gloss;
            ctx.fill();
            ctx.beginPath();
            ctx.arc(this.irisX - irisR*0.2, this.irisY - irisR*0.2, irisR*0.09, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(255,255,245,0.95)';
            ctx.fill();
            // тень верхнего века
            const shadow = ctx.createLinearGradient(0, -this.radius, 0, this.radius);
            shadow.addColorStop(0, 'rgba(0,0,0,0.55)');
            shadow.addColorStop(0.4, 'rgba(0,0,0,0)');
            ctx.fillStyle = shadow;
            ctx.fillRect(-this.radius, -this.radius, this.radius*2, this.radius*2);
            // влажный нижний край
            ctx.beginPath();
            ctx.ellipse(0, this.radius*0.45, this.radius*0.65, this.radius*0.08, 0, 0, Math.PI*2);
            const wet = ctx.createLinearGradient(0, this.radius*0.35, 0, this.radius*0.55);
            wet.addColorStop(0, 'rgba(255,255,255,0.45)');
            wet.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = wet;
            ctx.fill();
            // моргание
            if(this.blink > 0) {
                ctx.fillStyle = '#06090f';
                const close = this.radius * 1.6 * this.blink;
                ctx.fillRect(-this.radius*1.3, -this.radius, this.radius*2.6, close);
                ctx.fillRect(-this.radius*1.3, this.radius-close, this.radius*2.6, close);
            }
            ctx.restore();
        }
    }

    let leftEye, rightEye;
    let mouseX = window.innerWidth/2, mouseY = window.innerHeight/2;

    function initEyes() {
        const centerX = window.innerWidth/2;
        const centerY = window.innerHeight/2 - 40;
        leftEye = new Eye(centerX - 160, centerY);
        rightEye = new Eye(centerX + 160, centerY);
    }

    // Состояние позиции глаз (для анимации переключения)
    let eyeState = {
        x: window.innerWidth/2, y: window.innerHeight/2 - 40,
        scale: 1, spacing: 160,
        targetX: window.innerWidth/2, targetY: window.innerHeight/2 - 40,
        targetScale: 1, targetSpacing: 160
    };

    function updateEyeLayout() {
        eyeState.x += (eyeState.targetX - eyeState.x) * 0.1;
        eyeState.y += (eyeState.targetY - eyeState.y) * 0.1;
        eyeState.scale += (eyeState.targetScale - eyeState.scale) * 0.1;
        eyeState.spacing += (eyeState.targetSpacing - eyeState.spacing) * 0.1;
        if(leftEye) {
            leftEye.x = eyeState.x - eyeState.spacing;
            rightEye.x = eyeState.x + eyeState.spacing;
            leftEye.y = eyeState.y;
            rightEye.y = eyeState.y;
        }
    }

    // Моргание
    function blink() {
        let t = 0;
        const interval = setInterval(() => {
            t += 0.12;
            const v = Math.sin(t * Math.PI);
            if(leftEye) leftEye.blink = v;
            if(rightEye) rightEye.blink = v;
            if(t >= 1) {
                if(leftEye) leftEye.blink = 0;
                if(rightEye) rightEye.blink = 0;
                clearInterval(interval);
            }
        }, 16);
    }
    setInterval(() => blink(), 3500 + Math.random() * 2500);

    // Слежение за курсором
    window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
    window.addEventListener('touchmove', (e) => { if(e.touches[0]) { mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; } });
    window.addEventListener('touchstart', (e) => { if(e.touches[0]) { mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; } });

    // Рендер
    function render() {
        if(!leftEye) { initEyes(); }
        ctx.clearRect(0, 0, w, h);
        updateEyeLayout();
        leftEye.update(mouseX, mouseY, eyeState.scale);
        rightEye.update(mouseX, mouseY, eyeState.scale);
        leftEye.draw();
        rightEye.draw();
        requestAnimationFrame(render);
    }
    render();

    // ======================== UI ЛОГИКА ========================
    const tabs = document.querySelectorAll('.tab');
    const logo = document.getElementById('logo');
    const slogan = document.getElementById('slogan');
    const topBar = document.getElementById('topBar');
    const contentDiv = document.getElementById('content');
    const splash = document.getElementById('splash');
    const balanceSpan = document.getElementById('balanceDisplay');

    let currentBalance = 12500;
    function updateBalanceUI() {
        balanceSpan.innerText = currentBalance.toLocaleString() + ' кр.';
    }

    function renderContent(tab) {
        let html = '';
        if(tab === 'profile') {
            html = `<div class="card">
                        <h2>👤 ПРОФИЛЬ</h2>
                        <div>Социальный рейтинг: <strong>${currentBalance}</strong></div>
                        <div>Ранг: Достойный гражданин</div>
                        <div>Сообщений: 342</div>
                        <div>Эффекты: нет</div>
                        <button id="refreshBtn">Обновить</button>
                    </div>`;
        } else if(tab === 'bank') {
            html = `<div class="card"><h2>🏦 К-БАНК</h2><div>Кредиты: до 2000 кр.</div><div>Инвестиции: 4-15%</div><button>Взять кредит</button></div>`;
        } else if(tab === 'darknet') {
            html = `<div class="card"><h2>🕶️ ДАРКНЕТ</h2><div>Теневой кошелёк: 0 кр.</div><div>Грибы • Крабедрон</div><button>Перейти</button></div>`;
        } else if(tab === 'court') {
            html = `<div class="card"><h2>⚖️ СУД</h2><div>Активных исков: 0</div><button>Подать иск</button></div>`;
        } else if(tab === 'housing') {
            html = `<div class="card"><h2>🏙️ КРАБ-ЙОРК</h2><div>Крабхэттен • Студия от 3 млн</div><button>Выбрать жильё</button></div>`;
        }
        contentDiv.innerHTML = html;
        if(tab === 'profile') {
            document.getElementById('refreshBtn')?.addEventListener('click', () => {
                currentBalance += Math.floor(Math.random() * 500);
                updateBalanceUI();
                renderContent('profile');
            });
        }
    }

    function setActiveTab(tab) {
        tabs.forEach(btn => {
            btn.classList.remove('active');
            if(btn.dataset.tab === tab) btn.classList.add('active');
        });
        if(tab === 'home') {
            logo.classList.remove('hidden');
            slogan.classList.remove('hidden');
            topBar.classList.add('hidden');
            contentDiv.classList.add('hidden');
            // большие глаза по центру
            eyeState.targetX = window.innerWidth/2;
            eyeState.targetY = window.innerHeight/2 - 40;
            eyeState.targetScale = 1;
            eyeState.targetSpacing = 160;
        } else {
            logo.classList.add('hidden');
            slogan.classList.add('hidden');
            topBar.classList.remove('hidden');
            contentDiv.classList.remove('hidden');
            // маленькие глаза в правом нижнем углу (относительно центра экрана)
            eyeState.targetX = window.innerWidth - 70;
            eyeState.targetY = window.innerHeight - 70;
            eyeState.targetScale = 0.28;
            eyeState.targetSpacing = 28;
            renderContent(tab);
        }
    }

    tabs.forEach(btn => {
        btn.addEventListener('click', () => setActiveTab(btn.dataset.tab));
    });

    // Загрузочный экран: через 2 секунды скрыть splash и показать основное приложение
    setTimeout(() => {
        splash.classList.add('hide');
        setTimeout(() => { splash.style.display = 'none'; }, 600);
        setActiveTab('home');   // старт с главной
        updateBalanceUI();
    }, 2200);

    // Адаптация при ресайзе (корректировка target-позиции)
    window.addEventListener('resize', () => {
        if(document.querySelector('.tab.active')?.dataset.tab === 'home') {
            eyeState.targetX = window.innerWidth/2;
            eyeState.targetY = window.innerHeight/2 - 40;
            eyeState.targetSpacing = 160;
            eyeState.targetScale = 1;
        } else {
            eyeState.targetX = window.innerWidth - 70;
            eyeState.targetY = window.innerHeight - 70;
            eyeState.targetSpacing = 28;
            eyeState.targetScale = 0.28;
        }
    });
</script>
</body>
</html>
