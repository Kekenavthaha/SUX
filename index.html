<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SUX — северное сияние</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            overflow: hidden;
            background: #0a0f1c;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: #eef4ff;
        }

        /* ========== ФОН (глубокий тёмно-синий) ========== */
        .bg {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 30% 20%, #0e1a2a, #030614);
            animation: softBreath 16s infinite alternate;
        }
        @keyframes softBreath {
            0% { opacity: 0.9; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.02); }
        }

        /* Лёгкая сетка + звёзды */
        .grid {
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(100, 150, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(100, 150, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }
        .vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle, transparent 55%, rgba(0,0,0,0.5) 100%);
        }

        /* ========== SPLASH (5 сек) ========== */
        .splash {
            position: fixed;
            inset: 0;
            background: #0a0f1c;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease;
        }
        .splash.hide {
            opacity: 0;
            pointer-events: none;
        }
        .splash-logo {
            font-size: 86px;
            font-weight: 700;
            font-family: monospace;
            letter-spacing: 12px;
            background: linear-gradient(135deg, #bcd0ff, #6a8eff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: softPulse 1.4s infinite alternate;
        }
        .splash-title {
            margin-top: 20px;
            font-size: 15px;
            letter-spacing: 3px;
            color: #8aa9ff;
        }
        @keyframes softPulse {
            0% { opacity: 0.5; transform: scale(0.98); text-shadow: 0 0 5px #5a7eff; }
            100% { opacity: 1; transform: scale(1.01); text-shadow: 0 0 20px #5a7eff; }
        }

        /* ========== THREE.JS КОНТЕЙНЕР (северное сияние) ========== */
        #three-container {
            position: fixed;
            inset: 0;
            z-index: 3;
            pointer-events: none;
        }

        /* ========== ЛОГОТИП И СЛОГАН (на главной) ========== */
        .logo {
            position: fixed;
            bottom: 12%;
            width: 100%;
            text-align: center;
            font-size: clamp(42px, 10vw, 82px);
            font-weight: 700;
            font-family: monospace;
            letter-spacing: 8px;
            background: linear-gradient(135deg, #eef4ff, #bdd4ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 15px rgba(0,0,0,0.2);
            z-index: 5;
            transition: opacity 0.25s;
        }
        .slogan {
            position: fixed;
            width: 100%;
            bottom: 6%;
            text-align: center;
            color: #8aa9ff;
            letter-spacing: 2px;
            font-size: 12px;
            font-weight: 300;
            z-index: 5;
            transition: opacity 0.25s;
        }
        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* ========== ВЕРХНЯЯ ПАНЕЛЬ ========== */
        .top-bar {
            position: fixed;
            top: 16px;
            left: 16px;
            right: 16px;
            background: rgba(18, 25, 45, 0.6);
            backdrop-filter: blur(24px);
            border-radius: 60px;
            border: 1px solid rgba(140, 170, 255, 0.3);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            transition: opacity 0.25s;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
        }
        .balance {
            background: rgba(0,0,0,0.3);
            border-radius: 40px;
            padding: 5px 16px;
            font-weight: 600;
            font-size: 17px;
            color: #ffde9e;
            border: 1px solid rgba(255,220,100,0.3);
        }
        .user {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        .avatar {
            width: 34px;
            height: 34px;
            background: linear-gradient(145deg, #4b6ef0, #2b4ad0);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        /* ========== ОБЛАСТЬ КОНТЕНТА ========== */
        .content {
            position: fixed;
            top: 90px;
            left: 16px;
            right: 16px;
            bottom: 100px;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(18px);
            border-radius: 36px;
            border: 1px solid rgba(140, 170, 255, 0.2);
            padding: 20px;
            overflow-y: auto;
            z-index: 10;
            transition: opacity 0.25s;
        }
        .card {
            background: rgba(30, 40, 65, 0.5);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(140, 170, 255, 0.2);
            backdrop-filter: blur(4px);
        }
        .card h2 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #cbdffc;
        }
        .card button {
            background: #3b5bdb;
            border: none;
            padding: 12px 16px;
            border-radius: 48px;
            color: white;
            font-weight: 600;
            margin-top: 14px;
            width: 100%;
            cursor: pointer;
            transition: 0.1s;
        }
        .card button:active {
            transform: scale(0.97);
            background: #2a46b0;
        }

        /* ========== НИЖНЕЕ МЕНЮ ========== */
        .bottom {
            position: fixed;
            bottom: 18px;
            left: 16px;
            right: 16px;
            background: rgba(18, 25, 45, 0.75);
            backdrop-filter: blur(28px);
            border-radius: 48px;
            padding: 8px 12px;
            border: 1px solid rgba(140, 170, 255, 0.35);
            z-index: 10;
        }
        .menu {
            display: flex;
            justify-content: space-around;
            gap: 4px;
        }
        .tab {
            flex: 1;
            background: transparent;
            border: none;
            color: rgba(220, 240, 255, 0.6);
            font-size: 20px;
            padding: 10px 0;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }
        .tab span {
            font-size: 13px;
            display: none;
        }
        .tab.active {
            background: rgba(75, 110, 240, 0.25);
            color: #b4c8ff;
        }
        @media (min-width: 500px) {
            .tab span { display: inline; }
            .tab { font-size: 16px; gap: 8px; }
        }
    </style>
</head>
<body>

<div class="bg"></div>
<div class="grid"></div>
<div class="vignette"></div>

<div class="splash" id="splash">
    <div class="splash-logo">SUX</div>
    <div class="splash-title">СЕВЕРНОЕ СИЯНИЕ</div>
</div>

<div id="three-container"></div>

<div class="logo" id="logo">SUX</div>
<div class="slogan" id="slogan">Мягкий свет • Гармония • Присутствие</div>

<div class="top-bar hidden" id="topBar">
    <div class="user">
        <div class="avatar">🦀</div>
        <span>Краб Гражданин</span>
    </div>
    <div class="balance" id="balanceDisplay">12 500 кр.</div>
</div>

<div class="content hidden" id="content"></div>

<div class="bottom">
    <div class="menu">
        <button class="tab active" data-tab="home">🏠<span>Главная</span></button>
        <button class="tab" data-tab="profile">👤<span>Профиль</span></button>
        <button class="tab" data-tab="bank">🏦<span>Банк</span></button>
        <button class="tab" data-tab="darknet">🕶️<span>Даркнет</span></button>
        <button class="tab" data-tab="court">⚖️<span>Суд</span></button>
        <button class="tab" data-tab="housing">🏙️<span>Жильё</span></button>
    </div>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';

    // === НАСТРОЙКА СЦЕНЫ ===
    const container = document.getElementById('three-container');
    const scene = new THREE.Scene();
    scene.background = null;
    scene.fog = new THREE.FogExp2(0x0a0f1c, 0.012);

    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    camera.position.set(0, 0.5, 3.8);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setClearColor(0x000000, 0);
    container.appendChild(renderer.domElement);

    // === СОЗДАНИЕ ЭФФЕКТА «СЕВЕРНОЕ СИЯНИЕ» ===
    // Используем несколько изогнутых плоскостей с шейдерным материалом, которые плавно меняют форму и цвет.
    
    // Функция для создания ленты сияния
    function createAuroraBand(colorStops, yOffset, widthScale = 1.0) {
        // Геометрия: изогнутая лента (плоскость, деформированная синусом)
        const width = 3.2 * widthScale;
        const height = 1.2;
        const segments = 64;
        const geometry = new THREE.PlaneGeometry(width, height, segments, segments);
        const positions = geometry.attributes.position.array;
        
        // Изначально деформируем по Y, чтобы создать волны
        for (let i = 0; i < positions.length; i += 3) {
            const x = positions[i];
            const z = positions[i+2];
            // предварительная волна
            const yOffsetWave = Math.sin(x * 1.8) * 0.12 * Math.sin(z * 1.2);
            positions[i+1] += yOffsetWave;
        }
        geometry.computeVertexNormals();
        
        // Шейдерный материал с переливами и плавным движением
        const vertexShader = `
            varying vec2 vUv;
            uniform float uTime;
            void main() {
                vUv = uv;
                vec3 pos = position;
                // анимированная деформация: волны бегут по X и Z
                float wave1 = sin(pos.x * 1.5 + uTime * 1.2) * cos(pos.z * 1.2 - uTime * 0.8) * 0.07;
                float wave2 = sin(pos.x * 2.3 - uTime * 1.5) * 0.05;
                float wave3 = cos(pos.z * 2.0 + uTime * 1.0) * 0.05;
                pos.y += wave1 + wave2 + wave3;
                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                gl_PointSize = 1.0;
                gl_Position = projectionMatrix * mvPosition;
            }
        `;
        
        const fragmentShader = `
            uniform float uTime;
            varying vec2 vUv;
            void main() {
                vec2 uv = vUv;
                // создаём плавный градиент по вертикали (прозрачность к краям)
                float alphaTop = smoothstep(0.0, 0.3, uv.y) * (1.0 - smoothstep(0.7, 1.0, uv.y));
                float alpha = alphaTop * 0.7;
                // цветовая пульсация и смещение по горизонтали
                float hueShift = sin(uv.x * 4.0 + uTime * 0.8) * 0.3;
                float r = 0.3 + 0.25 * sin(uTime * 0.5 + uv.x * 3.0);
                float g = 0.6 + 0.3 * cos(uTime * 0.7 + uv.x * 2.5 + 1.2);
                float b = 0.9 + 0.2 * sin(uTime * 0.9 + uv.x * 4.0 + 2.4);
                vec3 color = vec3(r, g, b);
                // дополнительные фиолетовые оттенки в зависимости от uv.y
                color += vec3(0.2, 0.1, 0.4) * (uv.y * 0.8);
                color = clamp(color, 0.2, 1.0);
                gl_FragColor = vec4(color, alpha);
            }
        `;
        
        const material = new THREE.ShaderMaterial({
            uniforms: { uTime: { value: 0 } },
            vertexShader: vertexShader,
            fragmentShader: fragmentShader,
            transparent: true,
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide
        });
        
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.y = yOffset;
        mesh.rotation.x = -0.4;
        mesh.rotation.z = 0.2;
        scene.add(mesh);
        return { mesh, material };
    }
    
    // Создаём несколько лент с разными оттенками и положением
    const band1 = createAuroraBand(null, -0.4, 1.2);
    const band2 = createAuroraBand(null, 0.1, 1.0);
    const band3 = createAuroraBand(null, 0.5, 1.4);
    const band4 = createAuroraBand(null, -0.1, 1.1);
    
    // Добавляем мерцающие звёзды (частицы) для атмосферы
    const starCount = 1200;
    const starGeometry = new THREE.BufferGeometry();
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
        starPositions[i*3] = (Math.random() - 0.5) * 50;
        starPositions[i*3+1] = (Math.random() - 0.5) * 15 + 2;
        starPositions[i*3+2] = (Math.random() - 0.5) * 30 - 15;
    }
    starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starMaterial = new THREE.PointsMaterial({
        color: 0xaaccff,
        size: 0.03,
        transparent: true,
        opacity: 0.4,
        blending: THREE.AdditiveBlending
    });
    const stars = new THREE.Points(starGeometry, starMaterial);
    scene.add(stars);
    
    // Добавим очень лёгкий туман из частиц вокруг
    const dustCount = 800;
    const dustGeo = new THREE.BufferGeometry();
    const dustPositions = new Float32Array(dustCount * 3);
    for (let i = 0; i < dustCount; i++) {
        dustPositions[i*3] = (Math.random() - 0.5) * 8;
        dustPositions[i*3+1] = (Math.random() - 0.5) * 4;
        dustPositions[i*3+2] = (Math.random() - 0.5) * 6 - 2;
    }
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
    const dustMat = new THREE.PointsMaterial({
        color: 0x88aaff,
        size: 0.02,
        transparent: true,
        opacity: 0.2,
        blending: THREE.AdditiveBlending
    });
    const dust = new THREE.Points(dustGeo, dustMat);
    scene.add(dust);
    
    // Анимация
    let clock = new THREE.Clock();
    
    function animate() {
        const elapsedTime = clock.getElapsedTime();
        
        // обновляем шейдеры лент
        band1.material.uniforms.uTime.value = elapsedTime;
        band2.material.uniforms.uTime.value = elapsedTime + 0.5;
        band3.material.uniforms.uTime.value = elapsedTime + 1.0;
        band4.material.uniforms.uTime.value = elapsedTime + 0.2;
        
        // медленное вращение звёзд и пыли
        stars.rotation.y = elapsedTime * 0.02;
        dust.rotation.x = Math.sin(elapsedTime * 0.1) * 0.1;
        dust.rotation.z = Math.cos(elapsedTime * 0.15) * 0.05;
        
        // плавающая камера (очень медленно)
        camera.position.x = Math.sin(elapsedTime * 0.05) * 0.05;
        camera.position.y = 0.5 + Math.sin(elapsedTime * 0.07) * 0.03;
        camera.lookAt(0, 0.2, 0);
        
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    }
    
    animate();
    
    // Адаптация под размер окна
    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }
    
    // === УПРАВЛЕНИЕ UI ===
    const tabs = document.querySelectorAll('.tab');
    const logo = document.getElementById('logo');
    const slogan = document.getElementById('slogan');
    const topBar = document.getElementById('topBar');
    const contentDiv = document.getElementById('content');
    const splash = document.getElementById('splash');
    const balanceSpan = document.getElementById('balanceDisplay');
    const threeContainerElem = document.getElementById('three-container');
    
    let currentBalance = 12500;
    function updateBalanceUI() {
        balanceSpan.innerText = currentBalance.toLocaleString() + ' кр.';
    }
    
    function renderContent(tab) {
        let html = '';
        if(tab === 'profile') {
            html = `<div class="card">
                        <h2>👤 ПРОФИЛЬ</h2>
                        <div>Социальный рейтинг: <strong>${currentBalance}</strong></div>
                        <div>Ранг: Достойный гражданин</div>
                        <div>Сообщений: 342</div>
                        <div>Эффекты: нет</div>
                        <button id="refreshBtn">Обновить</button>
                    </div>`;
        } else if(tab === 'bank') {
            html = `<div class="card"><h2>🏦 К-БАНК</h2><div>Кредиты: до 2000 кр.</div><div>Инвестиции: 4-15%</div><button>Взять кредит</button></div>`;
        } else if(tab === 'darknet') {
            html = `<div class="card"><h2>🕶️ ДАРКНЕТ</h2><div>Теневой кошелёк: 0 кр.</div><div>Грибы • Крабедрон</div><button>Перейти</button></div>`;
        } else if(tab === 'court') {
            html = `<div class="card"><h2>⚖️ СУД</h2><div>Активных исков: 0</div><button>Подать иск</button></div>`;
        } else if(tab === 'housing') {
            html = `<div class="card"><h2>🏙️ КРАБ-ЙОРК</h2><div>Крабхэттен • Студия от 3 млн</div><button>Выбрать жильё</button></div>`;
        }
        contentDiv.innerHTML = html;
        if(tab === 'profile') {
            document.getElementById('refreshBtn')?.addEventListener('click', () => {
                currentBalance += Math.floor(Math.random() * 500);
                updateBalanceUI();
                renderContent('profile');
            });
        }
    }
    
    function setActiveTab(tab) {
        tabs.forEach(btn => {
            btn.classList.remove('active');
            if(btn.dataset.tab === tab) btn.classList.add('active');
        });
        if(tab === 'home') {
            threeContainerElem.style.opacity = '1';
            threeContainerElem.style.visibility = 'visible';
            logo.classList.remove('hidden');
            slogan.classList.remove('hidden');
            topBar.classList.add('hidden');
            contentDiv.classList.add('hidden');
        } else {
            threeContainerElem.style.opacity = '0';
            threeContainerElem.style.visibility = 'hidden';
            logo.classList.add('hidden');
            slogan.classList.add('hidden');
            topBar.classList.remove('hidden');
            contentDiv.classList.remove('hidden');
            renderContent(tab);
        }
    }
    
    tabs.forEach(btn => {
        btn.addEventListener('click', () => setActiveTab(btn.dataset.tab));
    });
    
    // Splash 5 секунд
    setTimeout(() => {
        splash.classList.add('hide');
        setTimeout(() => { splash.style.display = 'none'; }, 800);
        setActiveTab('home');
        updateBalanceUI();
    }, 5000);
</script>
</body>
</html>
