<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SUX — эфирная связь</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            overflow: hidden;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: #eef4ff;
        }

        /* ========== ОСНОВНОЙ АНИМИРОВАННЫЙ ГРАДИЕНТ (фон приложения) ========== */
        .app-bg {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 30%, #0a1a2f, #071221);
            z-index: 0;
        }

        .gradient-layer {
            position: fixed;
            inset: 0;
            background: linear-gradient(125deg, #0a2a4a, #0e3455, #1a4a6e, #0f2a48);
            background-size: 300% 300%;
            animation: gradientMove 22s ease infinite alternate;
            opacity: 0.7;
            z-index: 1;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 100%; }
            100% { background-position: 0% 0%; }
        }

        /* Дополнительное сияние */
        .glow {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(40, 120, 200, 0.15), transparent 70%);
            pointer-events: none;
            z-index: 2;
        }

        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, transparent 55%, rgba(0,0,0,0.5) 100%);
            pointer-events: none;
            z-index: 2;
        }

        /* ========== SPLASH (5 секунд, многоуровневый градиент) ========== */
        .splash {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 30% 20%, #0b1f33, #04121f);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease;
        }
        .splash .gradient-bg {
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, #0d2b4a, #13456a, #0a2848, #1a5a85);
            background-size: 400% 400%;
            animation: splashGradient 18s ease infinite alternate;
            opacity: 0.9;
        }
        @keyframes splashGradient {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 100%; }
            100% { background-position: 0% 0%; }
        }
        .splash .glow-layer {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(30, 150, 220, 0.3), transparent 70%);
            pointer-events: none;
        }
        .splash.hide {
            opacity: 0;
            pointer-events: none;
        }
        .splash-logo {
            position: relative;
            z-index: 5;
            font-size: 86px;
            font-weight: 700;
            font-family: monospace;
            letter-spacing: 12px;
            background: linear-gradient(135deg, #b0e0ff, #6a9eff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(80, 150, 255, 0.3);
            animation: softPulse 1.4s infinite alternate;
        }
        .splash-title {
            position: relative;
            z-index: 5;
            margin-top: 20px;
            font-size: 15px;
            letter-spacing: 3px;
            color: #8ab3ff;
        }
        @keyframes softPulse {
            0% { opacity: 0.6; transform: scale(0.98); text-shadow: 0 0 5px #3a7eff; }
            100% { opacity: 1; transform: scale(1.01); text-shadow: 0 0 25px #3a7eff; }
        }

        /* ========== ВЕРХНЯЯ ПАНЕЛЬ ========== */
        .top-bar {
            position: fixed;
            top: 16px;
            left: 16px;
            right: 16px;
            background: rgba(10, 20, 35, 0.6);
            backdrop-filter: blur(24px);
            border-radius: 60px;
            border: 1px solid rgba(100, 160, 255, 0.25);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
        }
        .balance {
            background: rgba(0,0,0,0.3);
            border-radius: 40px;
            padding: 5px 16px;
            font-weight: 600;
            font-size: 17px;
            color: #ffde9e;
            border: 1px solid rgba(255,220,100,0.3);
        }
        .user {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        .avatar {
            width: 34px;
            height: 34px;
            background: linear-gradient(145deg, #3a6ae0, #1f3c9e);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        /* ========== ОСНОВНОЙ КОНТЕНТ ========== */
        .content {
            position: fixed;
            top: 90px;
            left: 16px;
            right: 16px;
            bottom: 90px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(18px);
            border-radius: 36px;
            border: 1px solid rgba(100, 160, 255, 0.2);
            padding: 20px;
            overflow-y: auto;
            z-index: 100;
            scrollbar-width: thin;
        }
        .card {
            background: rgba(20, 35, 55, 0.5);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(100, 160, 255, 0.2);
            backdrop-filter: blur(4px);
        }
        .card h2 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #cbdffc;
            font-weight: 500;
        }
        .card button {
            background: #2e5ad0;
            border: none;
            padding: 12px 16px;
            border-radius: 48px;
            color: white;
            font-weight: 600;
            margin-top: 14px;
            width: 100%;
            cursor: pointer;
            transition: 0.1s;
        }
        .card button:active {
            transform: scale(0.97);
            background: #1f42a0;
        }

        /* ========== НИЖНЕЕ МЕНЮ (БЕЗ ГЛАВНОЙ) ========== */
        .bottom {
            position: fixed;
            bottom: 18px;
            left: 16px;
            right: 16px;
            background: rgba(10, 20, 35, 0.75);
            backdrop-filter: blur(28px);
            border-radius: 48px;
            padding: 8px 12px;
            border: 1px solid rgba(100, 160, 255, 0.35);
            z-index: 100;
        }
        .menu {
            display: flex;
            justify-content: space-around;
            gap: 4px;
        }
        .tab {
            flex: 1;
            background: transparent;
            border: none;
            color: rgba(180, 210, 255, 0.7);
            font-size: 20px;
            padding: 8px 0;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }
        .tab span {
            font-size: 13px;
            display: none;
        }
        .tab.active {
            background: rgba(50, 110, 230, 0.3);
            color: #bbd4ff;
        }
        @media (min-width: 500px) {
            .tab span { display: inline; }
            .tab { font-size: 16px; gap: 8px; }
        }
    </style>
</head>
<body>

<!-- Фон приложения (постоянный, многослойный) -->
<div class="app-bg"></div>
<div class="gradient-layer"></div>
<div class="glow"></div>
<div class="vignette"></div>

<!-- Splash -->
<div class="splash" id="splash">
    <div class="gradient-bg"></div>
    <div class="glow-layer"></div>
    <div class="splash-logo">SUX</div>
    <div class="splash-title">ЗАРЯЖАЮ ЭФИР</div>
</div>

<!-- Верхняя панель (видна после splash) -->
<div class="top-bar" id="topBar">
    <div class="user">
        <div class="avatar">🦀</div>
        <span>Краб Гражданин</span>
    </div>
    <div class="balance" id="balanceDisplay">12 500 кр.</div>
</div>

<!-- Основной контент -->
<div class="content" id="content"></div>

<!-- Нижнее меню (без home) -->
<div class="bottom">
    <div class="menu">
        <button class="tab active" data-tab="profile">👤<span>Профиль</span></button>
        <button class="tab" data-tab="bank">🏦<span>Банк</span></button>
        <button class="tab" data-tab="darknet">🕶️<span>Даркнет</span></button>
        <button class="tab" data-tab="court">⚖️<span>Суд</span></button>
        <button class="tab" data-tab="housing">🏙️<span>Жильё</span></button>
    </div>
</div>

<script>
    // ========== UI ЛОГИКА (нет главной страницы) ==========
    const tabs = document.querySelectorAll('.tab');
    const contentDiv = document.getElementById('content');
    const splash = document.getElementById('splash');
    const balanceSpan = document.getElementById('balanceDisplay');

    let currentBalance = 12500;
    function updateBalanceUI() {
        balanceSpan.innerText = currentBalance.toLocaleString() + ' кр.';
    }

    function renderContent(tab) {
        let html = '';
        if(tab === 'profile') {
            html = `<div class="card">
                        <h2>👤 ПРОФИЛЬ</h2>
                        <div>Социальный рейтинг: <strong>${currentBalance}</strong></div>
                        <div>Ранг: Достойный гражданин</div>
                        <div>Сообщений: 342</div>
                        <div>Эффекты: нет</div>
                        <button id="refreshBtn">Обновить</button>
                    </div>`;
        } else if(tab === 'bank') {
            html = `<div class="card"><h2>🏦 К-БАНК</h2><div>Кредиты: до 2000 кр.</div><div>Инвестиции: 4-15%</div><button>Взять кредит</button></div>`;
        } else if(tab === 'darknet') {
            html = `<div class="card"><h2>🕶️ ДАРКНЕТ</h2><div>Теневой кошелёк: 0 кр.</div><div>Грибы • Крабедрон</div><button>Перейти</button></div>`;
        } else if(tab === 'court') {
            html = `<div class="card"><h2>⚖️ СУД</h2><div>Активных исков: 0</div><button>Подать иск</button></div>`;
        } else if(tab === 'housing') {
            html = `<div class="card"><h2>🏙️ КРАБ-ЙОРК</h2><div>Крабхэттен • Студия от 3 млн</div><button>Выбрать жильё</button></div>`;
        }
        contentDiv.innerHTML = html;
        if(tab === 'profile') {
            const btn = document.getElementById('refreshBtn');
            if(btn) btn.addEventListener('click', () => {
                currentBalance += Math.floor(Math.random() * 500);
                updateBalanceUI();
                renderContent('profile');
            });
        }
    }

    function setActiveTab(tab) {
        tabs.forEach(btn => {
            btn.classList.remove('active');
            if(btn.dataset.tab === tab) btn.classList.add('active');
        });
        renderContent(tab);
    }

    tabs.forEach(btn => {
        btn.addEventListener('click', () => setActiveTab(btn.dataset.tab));
    });

    // Стартуем с вкладки "profile"
    setActiveTab('profile');
    updateBalanceUI();

    // Splash на 5 секунд
    setTimeout(() => {
        splash.classList.add('hide');
        setTimeout(() => { splash.style.display = 'none'; }, 800);
    }, 5000);
</script>
</body>
</html>
