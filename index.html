<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SUX — эфирная связь</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            overflow: hidden;
            background: #0a0f1c;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: #eef4ff;
        }

        /* ========== ФОН (глубокий космический) ========== */
        .bg {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 30% 20%, #0e152a, #02040c);
            animation: cosmicBreath 14s infinite alternate ease-in-out;
        }
        @keyframes cosmicBreath {
            0% { opacity: 0.9; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.02); }
        }

        /* Лёгкая сетка и звёздная пыль */
        .grid {
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(100, 150, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(100, 150, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }

        .vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle, transparent 55%, rgba(0,0,0,0.5) 100%);
        }

        /* ========== SPLASH (5 сек) ========== */
        .splash {
            position: fixed;
            inset: 0;
            background: #0a0f1c;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease;
        }
        .splash.hide {
            opacity: 0;
            pointer-events: none;
        }
        .splash-logo {
            font-size: 86px;
            font-weight: 700;
            font-family: monospace;
            letter-spacing: 12px;
            background: linear-gradient(135deg, #bcd0ff, #6a8eff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: softPulse 1.4s infinite alternate;
        }
        .splash-title {
            margin-top: 20px;
            font-size: 15px;
            letter-spacing: 3px;
            color: #8aa9ff;
        }
        @keyframes softPulse {
            0% { opacity: 0.5; transform: scale(0.98); text-shadow: 0 0 5px #5a7eff; }
            100% { opacity: 1; transform: scale(1.01); text-shadow: 0 0 20px #5a7eff; }
        }

        /* ========== THREE.JS КОНТЕЙНЕР ========== */
        #three-container {
            position: fixed;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas.webgl {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ========== ЛОГОТИП И СЛОГАН (на главной) ========== */
        .logo {
            position: fixed;
            bottom: 12%;
            width: 100%;
            text-align: center;
            font-size: clamp(42px, 10vw, 82px);
            font-weight: 700;
            font-family: monospace;
            letter-spacing: 8px;
            background: linear-gradient(135deg, #eef4ff, #bdd4ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 15px rgba(0,0,0,0.2);
            z-index: 5;
            transition: opacity 0.25s;
        }
        .slogan {
            position: fixed;
            width: 100%;
            bottom: 6%;
            text-align: center;
            color: #8aa9ff;
            letter-spacing: 2px;
            font-size: 12px;
            font-weight: 300;
            z-index: 5;
            transition: opacity 0.25s;
        }
        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* ========== ВЕРХНЯЯ ПАНЕЛЬ ========== */
        .top-bar {
            position: fixed;
            top: 16px;
            left: 16px;
            right: 16px;
            background: rgba(18, 25, 45, 0.6);
            backdrop-filter: blur(24px);
            border-radius: 60px;
            border: 1px solid rgba(140, 170, 255, 0.3);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            transition: opacity 0.25s;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
        }
        .balance {
            background: rgba(0,0,0,0.3);
            border-radius: 40px;
            padding: 5px 16px;
            font-weight: 600;
            font-size: 17px;
            color: #ffde9e;
            border: 1px solid rgba(255,220,100,0.3);
        }
        .user {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        .avatar {
            width: 34px;
            height: 34px;
            background: linear-gradient(145deg, #4b6ef0, #2b4ad0);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        /* ========== ОБЛАСТЬ КОНТЕНТА ========== */
        .content {
            position: fixed;
            top: 90px;
            left: 16px;
            right: 16px;
            bottom: 100px;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(18px);
            border-radius: 36px;
            border: 1px solid rgba(140, 170, 255, 0.2);
            padding: 20px;
            overflow-y: auto;
            z-index: 10;
            transition: opacity 0.25s;
        }
        .card {
            background: rgba(30, 40, 65, 0.5);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(140, 170, 255, 0.2);
            backdrop-filter: blur(4px);
        }
        .card h2 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #cbdffc;
        }
        .card button {
            background: #3b5bdb;
            border: none;
            padding: 12px 16px;
            border-radius: 48px;
            color: white;
            font-weight: 600;
            margin-top: 14px;
            width: 100%;
            cursor: pointer;
            transition: 0.1s;
        }
        .card button:active {
            transform: scale(0.97);
            background: #2a46b0;
        }

        /* ========== НИЖНЕЕ МЕНЮ ========== */
        .bottom {
            position: fixed;
            bottom: 18px;
            left: 16px;
            right: 16px;
            background: rgba(18, 25, 45, 0.75);
            backdrop-filter: blur(28px);
            border-radius: 48px;
            padding: 8px 12px;
            border: 1px solid rgba(140, 170, 255, 0.35);
            z-index: 10;
        }
        .menu {
            display: flex;
            justify-content: space-around;
            gap: 4px;
        }
        .tab {
            flex: 1;
            background: transparent;
            border: none;
            color: rgba(220, 240, 255, 0.6);
            font-size: 20px;
            padding: 10px 0;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }
        .tab span {
            font-size: 13px;
            display: none;
        }
        .tab.active {
            background: rgba(75, 110, 240, 0.25);
            color: #b4c8ff;
        }
        @media (min-width: 500px) {
            .tab span { display: inline; }
            .tab { font-size: 16px; gap: 8px; }
        }
    </style>
</head>
<body>

<div class="bg"></div>
<div class="grid"></div>
<div class="vignette"></div>

<div class="splash" id="splash">
    <div class="splash-logo">SUX</div>
    <div class="splash-title">ЗАРЯЖАЮ ЭФИР</div>
</div>

<div id="three-container"></div>

<div class="logo" id="logo">SUX</div>
<div class="slogan" id="slogan">Присутствие • Поток • Гармония</div>

<div class="top-bar hidden" id="topBar">
    <div class="user">
        <div class="avatar">🦀</div>
        <span>Краб Гражданин</span>
    </div>
    <div class="balance" id="balanceDisplay">12 500 кр.</div>
</div>

<div class="content hidden" id="content"></div>

<div class="bottom">
    <div class="menu">
        <button class="tab active" data-tab="home">🏠<span>Главная</span></button>
        <button class="tab" data-tab="profile">👤<span>Профиль</span></button>
        <button class="tab" data-tab="bank">🏦<span>Банк</span></button>
        <button class="tab" data-tab="darknet">🕶️<span>Даркнет</span></button>
        <button class="tab" data-tab="court">⚖️<span>Суд</span></button>
        <button class="tab" data-tab="housing">🏙️<span>Жильё</span></button>
    </div>
</div>

<!-- Three.js библиотеки -->
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';

    // === НАСТРОЙКА СЦЕНЫ ===
    const container = document.getElementById('three-container');
    const scene = new THREE.Scene();
    scene.background = null; // прозрачный, чтобы фон был из CSS
    scene.fog = new THREE.FogExp2(0x0a0f1c, 0.008);

    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    camera.position.set(0, 0, 3.5);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setClearColor(0x000000, 0);
    container.appendChild(renderer.domElement);

    // === СОЗДАНИЕ ПЛАЗМОИДА (Io-подобная сфера с искажениями) ===
    // Используем шейдерный материал для пульсации и свечения, плюс частицы
    
    // 1. Основная сфера с текстурой шума и искажением вертексов
    const geometry = new THREE.SphereGeometry(1.2, 128, 128);
    
    // Кастомный шейдер для свечения и эффекта "живого" существа
    const vertexShader = `
        varying vec2 vUv;
        varying vec3 vPosition;
        uniform float uTime;
        void main() {
            vUv = uv;
            vec3 pos = position;
            // искажение по нормали, синусоидальное
            float noise = sin(pos.x * 3.0 + uTime) * cos(pos.y * 2.5 + uTime * 0.7) * sin(pos.z * 2.8 + uTime * 0.5);
            pos += normal * noise * 0.12;
            vPosition = pos;
            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            gl_PointSize = 1.0;
            gl_Position = projectionMatrix * mvPosition;
        }
    `;
    
    const fragmentShader = `
        uniform float uTime;
        varying vec2 vUv;
        varying vec3 vPosition;
        void main() {
            vec2 uv = vUv;
            // градиент от центра к краям
            float distToCenter = length(uv - 0.5) * 1.4;
            float glow = 1.0 - smoothstep(0.2, 1.0, distToCenter);
            // пульсация
            float pulse = 0.7 + 0.4 * sin(uTime * 1.8);
            // цвета: перламутровый, голубой, фиолетовый
            vec3 colorA = vec3(0.4, 0.7, 1.0);  // небесный
            vec3 colorB = vec3(0.7, 0.5, 1.0);  // сиреневый
            vec3 colorC = vec3(0.2, 0.8, 0.9);  // бирюзовый
            float t = sin(uv.x * 8.0 + uTime) * cos(uv.y * 7.0 - uTime * 1.2);
            vec3 baseColor = mix(colorA, colorB, sin(uTime * 0.6) * 0.5 + 0.5);
            baseColor = mix(baseColor, colorC, sin(uv.y * 12.0 + uTime) * 0.3);
            // свечение
            float alpha = glow * (0.6 + pulse * 0.4);
            vec3 finalColor = baseColor * (0.8 + glow * 0.8);
            gl_FragColor = vec4(finalColor, alpha);
        }
    `;
    
    const shaderMaterial = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 }
        },
        vertexShader: vertexShader,
        fragmentShader: fragmentShader,
        transparent: true,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide
    });
    
    const coreSphere = new THREE.Mesh(geometry, shaderMaterial);
    scene.add(coreSphere);
    
    // 2. Внешняя оболочка из частиц (сияющий ореол)
    const particleCount = 2800;
    const particleGeometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount; i++) {
        // точки на сфере радиуса 1.4-1.8
        const radius = 1.4 + Math.random() * 0.4;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const x = radius * Math.sin(phi) * Math.cos(theta);
        const y = radius * Math.sin(phi) * Math.sin(theta);
        const z = radius * Math.cos(phi);
        positions[i*3] = x;
        positions[i*3+1] = y;
        positions[i*3+2] = z;
    }
    particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    
    const particleMaterial = new THREE.PointsMaterial({
        color: 0x88aaff,
        size: 0.025,
        transparent: true,
        blending: THREE.AdditiveBlending,
        opacity: 0.6
    });
    const particleSystem = new THREE.Points(particleGeometry, particleMaterial);
    scene.add(particleSystem);
    
    // 3. Дополнительные вращающиеся лучи (тонкие торы)
    const ringGeo = new THREE.TorusGeometry(1.25, 0.03, 64, 300);
    const ringMat = new THREE.MeshStandardMaterial({
        color: 0x6d8eff,
        emissive: 0x2a4ad0,
        emissiveIntensity: 0.5,
        transparent: true,
        opacity: 0.35,
        side: THREE.DoubleSide
    });
    const ring1 = new THREE.Mesh(ringGeo, ringMat);
    const ring2 = new THREE.Mesh(ringGeo, ringMat);
    const ring3 = new THREE.Mesh(ringGeo, ringMat);
    ring1.rotation.x = Math.PI / 2;
    ring2.rotation.z = Math.PI / 3;
    ring3.rotation.x = Math.PI / 1.5;
    scene.add(ring1);
    scene.add(ring2);
    scene.add(ring3);
    
    // 4. Мерцающие частицы вокруг (атмосфера)
    const dustCount = 1800;
    const dustGeo = new THREE.BufferGeometry();
    const dustPositions = new Float32Array(dustCount * 3);
    for (let i = 0; i < dustCount; i++) {
        const r = 1.7 + Math.random() * 0.8;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        dustPositions[i*3] = r * Math.sin(phi) * Math.cos(theta);
        dustPositions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
        dustPositions[i*3+2] = r * Math.cos(phi);
    }
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
    const dustMat = new THREE.PointsMaterial({
        color: 0xaaccff,
        size: 0.012,
        transparent: true,
        blending: THREE.AdditiveBlending,
        opacity: 0.4
    });
    const dustSystem = new THREE.Points(dustGeo, dustMat);
    scene.add(dustSystem);
    
    // 5. Источник света для колец
    const ambientLight = new THREE.AmbientLight(0x222222);
    scene.add(ambientLight);
    const pointLight = new THREE.PointLight(0x4488ff, 0.8, 8);
    pointLight.position.set(1, 2, 2);
    scene.add(pointLight);
    const backLight = new THREE.PointLight(0xff88aa, 0.4);
    backLight.position.set(-1, -1, -2);
    scene.add(backLight);
    
    // Анимация
    let clock = new THREE.Clock();
    
    function animate() {
        const elapsedTime = clock.getElapsedTime();
        
        // обновляем шейдер
        shaderMaterial.uniforms.uTime.value = elapsedTime;
        
        // вращаем кольца
        ring1.rotation.z += 0.003;
        ring1.rotation.y += 0.002;
        ring2.rotation.x += 0.004;
        ring2.rotation.z += 0.003;
        ring3.rotation.y += 0.005;
        ring3.rotation.x += 0.002;
        
        // плавное изменение цвета частиц
        const hue = (Math.sin(elapsedTime * 0.3) * 0.1 + 0.6);
        particleMaterial.color.setHSL(hue, 0.8, 0.65);
        dustMat.color.setHSL(hue + 0.05, 0.7, 0.6);
        
        // мягкая пульсация масштаба всей группы (легкая)
        const scale = 1 + Math.sin(elapsedTime * 1.2) * 0.02;
        coreSphere.scale.set(scale, scale, scale);
        particleSystem.scale.set(scale, scale, scale);
        dustSystem.scale.set(scale, scale, scale);
        ring1.scale.setScalar(scale);
        ring2.scale.setScalar(scale);
        ring3.scale.setScalar(scale);
        
        // вращение камеры? нет, статично
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    }
    
    animate();
    
    // Адаптация под размер окна
    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }
    
    // === УПРАВЛЕНИЕ UI ===
    const tabs = document.querySelectorAll('.tab');
    const logo = document.getElementById('logo');
    const slogan = document.getElementById('slogan');
    const topBar = document.getElementById('topBar');
    const contentDiv = document.getElementById('content');
    const splash = document.getElementById('splash');
    const balanceSpan = document.getElementById('balanceDisplay');
    const threeContainer = document.getElementById('three-container');
    
    let currentBalance = 12500;
    function updateBalanceUI() {
        balanceSpan.innerText = currentBalance.toLocaleString() + ' кр.';
    }
    
    function renderContent(tab) {
        let html = '';
        if(tab === 'profile') {
            html = `<div class="card">
                        <h2>👤 ПРОФИЛЬ</h2>
                        <div>Социальный рейтинг: <strong>${currentBalance}</strong></div>
                        <div>Ранг: Достойный гражданин</div>
                        <div>Сообщений: 342</div>
                        <div>Эффекты: нет</div>
                        <button id="refreshBtn">Обновить</button>
                    </div>`;
        } else if(tab === 'bank') {
            html = `<div class="card"><h2>🏦 К-БАНК</h2><div>Кредиты: до 2000 кр.</div><div>Инвестиции: 4-15%</div><button>Взять кредит</button></div>`;
        } else if(tab === 'darknet') {
            html = `<div class="card"><h2>🕶️ ДАРКНЕТ</h2><div>Теневой кошелёк: 0 кр.</div><div>Грибы • Крабедрон</div><button>Перейти</button></div>`;
        } else if(tab === 'court') {
            html = `<div class="card"><h2>⚖️ СУД</h2><div>Активных исков: 0</div><button>Подать иск</button></div>`;
        } else if(tab === 'housing') {
            html = `<div class="card"><h2>🏙️ КРАБ-ЙОРК</h2><div>Крабхэттен • Студия от 3 млн</div><button>Выбрать жильё</button></div>`;
        }
        contentDiv.innerHTML = html;
        if(tab === 'profile') {
            document.getElementById('refreshBtn')?.addEventListener('click', () => {
                currentBalance += Math.floor(Math.random() * 500);
                updateBalanceUI();
                renderContent('profile');
            });
        }
    }
    
    function setActiveTab(tab) {
        tabs.forEach(btn => {
            btn.classList.remove('active');
            if(btn.dataset.tab === tab) btn.classList.add('active');
        });
        if(tab === 'home') {
            threeContainer.style.opacity = '1';
            threeContainer.style.visibility = 'visible';
            logo.classList.remove('hidden');
            slogan.classList.remove('hidden');
            topBar.classList.add('hidden');
            contentDiv.classList.add('hidden');
        } else {
            threeContainer.style.opacity = '0';
            threeContainer.style.visibility = 'hidden';
            logo.classList.add('hidden');
            slogan.classList.add('hidden');
            topBar.classList.remove('hidden');
            contentDiv.classList.remove('hidden');
            renderContent(tab);
        }
    }
    
    tabs.forEach(btn => {
        btn.addEventListener('click', () => setActiveTab(btn.dataset.tab));
    });
    
    // Splash 5 секунд
    setTimeout(() => {
        splash.classList.add('hide');
        setTimeout(() => { splash.style.display = 'none'; }, 800);
        setActiveTab('home');
        updateBalanceUI();
    }, 5000);
</script>
</body>
</html>
