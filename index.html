<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUX — Detroit Android Eye</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#06090f;
    font-family:Segoe UI,sans-serif;
}

/* =========================
   BACKGROUND
========================= */

.bg{

    position:fixed;
    inset:0;

    background:
    radial-gradient(circle at top left,
    rgba(40,90,160,.18),
    transparent 35%),

    radial-gradient(circle at bottom right,
    rgba(120,20,30,.18),
    transparent 35%),

    linear-gradient(
    135deg,
    #05070b,
    #0a0f17,
    #070b11);

    animation:bgPulse 10s ease infinite alternate;
}

@keyframes bgPulse{

    from{
        filter:hue-rotate(0deg);
        transform:scale(1);
    }

    to{
        filter:hue-rotate(15deg);
        transform:scale(1.03);
    }
}

/* =========================
   GRID
========================= */

.grid{

    position:fixed;
    inset:0;

    background-image:
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);

    background-size:42px 42px;

    opacity:.5;
}

/* =========================
   CANVAS
========================= */

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

/* =========================
   LOGO
========================= */

.logo{

    position:fixed;

    bottom:14%;
    width:100%;

    text-align:center;

    font-size:88px;
    font-weight:900;

    letter-spacing:12px;

    color:rgba(255,70,70,.75);

    text-shadow:
    0 0 24px rgba(255,0,0,.35);

    font-family:monospace;

    z-index:10;
}

.slogan{

    position:fixed;

    bottom:8%;
    width:100%;

    text-align:center;

    color:rgba(255,255,255,.4);

    font-size:12px;

    letter-spacing:3px;

    z-index:10;
}

/* =========================
   BUTTON
========================= */

.btn{

    position:fixed;

    right:24px;
    bottom:24px;

    z-index:20;

    border:none;

    border-radius:999px;

    padding:14px 24px;

    background:#cf3a3a;

    color:white;

    font-weight:700;

    cursor:pointer;

    box-shadow:
    0 6px 24px rgba(0,0,0,.4);

    transition:.12s;
}

.btn:active{
    transform:scale(.95);
}

@media(max-width:700px){

    .logo{
        font-size:52px;
    }
}

</style>
</head>

<body>

<div class="bg"></div>
<div class="grid"></div>

<canvas id="canvas"></canvas>

<div class="logo">SUX</div>

<div class="slogan">
ANDROID SURVEILLANCE ACTIVE
</div>

<button class="btn" id="scanBtn">
👁 SCAN
</button>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let w,h;

function resize(){

    w = canvas.width = innerWidth;
    h = canvas.height = innerHeight;
}

resize();

addEventListener("resize",resize);

/* =========================
   EYE OBJECT
========================= */

class Eye{

    constructor(x,y){

        this.x = x;
        this.y = y;

        this.radius = Math.min(w,h)*0.12;

        this.irisX = 0;
        this.irisY = 0;

        this.targetX = 0;
        this.targetY = 0;

        this.blink = 0;

        this.autoMoveTime = 0;
    }

    update(mx,my){

        const dx = mx - this.x;
        const dy = my - this.y;

        const angle = Math.atan2(dy,dx);

        const dist = Math.min(18,Math.hypot(dx,dy)*0.03);

        this.targetX = Math.cos(angle)*dist;
        this.targetY = Math.sin(angle)*dist;

        this.irisX += (this.targetX - this.irisX)*0.12;
        this.irisY += (this.targetY - this.irisY)*0.12;
    }

    draw(){

        ctx.save();

        ctx.translate(this.x,this.y);

        /* eye shape */

        ctx.beginPath();

        ctx.moveTo(-this.radius,0);

        ctx.quadraticCurveTo(
            0,
            -this.radius*0.72,
            this.radius,
            0
        );

        ctx.quadraticCurveTo(
            0,
            this.radius*0.72,
            -this.radius,
            0
        );

        ctx.closePath();

        ctx.clip();

        /* sclera */

        const sclera =
        ctx.createRadialGradient(
            0,
            0,
            10,
            0,
            0,
            this.radius
        );

        sclera.addColorStop(0,"#ffffff");
        sclera.addColorStop(.7,"#ececec");
        sclera.addColorStop(1,"#bcbcbc");

        ctx.fillStyle = sclera;

        ctx.fillRect(
            -this.radius,
            -this.radius,
            this.radius*2,
            this.radius*2
        );

        /* iris */

        const irisR = this.radius*0.42;

        const iris =
        ctx.createRadialGradient(
            this.irisX,
            this.irisY,
            5,
            this.irisX,
            this.irisY,
            irisR
        );

        iris.addColorStop(0,"#c8ffff");
        iris.addColorStop(.2,"#77e7ff");
        iris.addColorStop(.45,"#2ea7ff");
        iris.addColorStop(.7,"#0a507c");
        iris.addColorStop(1,"#000");

        ctx.beginPath();

        ctx.arc(
            this.irisX,
            this.irisY,
            irisR,
            0,
            Math.PI*2
        );

        ctx.fillStyle = iris;
        ctx.fill();

        /* iris lines */

        for(let i=0;i<70;i++){

            const a = (Math.PI*2/70)*i;

            ctx.beginPath();

            ctx.moveTo(
                this.irisX,
                this.irisY
            );

            ctx.lineTo(
                this.irisX + Math.cos(a)*irisR,
                this.irisY + Math.sin(a)*irisR
            );

            ctx.strokeStyle =
            "rgba(255,255,255,.06)";

            ctx.lineWidth = 1;

            ctx.stroke();
        }

        /* pupil */

        ctx.beginPath();

        ctx.arc(
            this.irisX,
            this.irisY,
            irisR*0.28,
            0,
            Math.PI*2
        );

        ctx.fillStyle = "#000";
        ctx.fill();

        /* glossy cornea */

        const gloss =
        ctx.createRadialGradient(
            this.irisX - irisR*0.2,
            this.irisY - irisR*0.2,
            1,
            this.irisX - irisR*0.2,
            this.irisY - irisR*0.2,
            irisR*0.8
        );

        gloss.addColorStop(0,
        "rgba(255,255,255,.75)");

        gloss.addColorStop(.4,
        "rgba(255,255,255,.18)");

        gloss.addColorStop(1,
        "rgba(255,255,255,0)");

        ctx.beginPath();

        ctx.arc(
            this.irisX,
            this.irisY,
            irisR,
            0,
            Math.PI*2
        );

        ctx.fillStyle = gloss;
        ctx.fill();

        /* upper shadow */

        const shadow =
        ctx.createLinearGradient(
            0,
            -this.radius,
            0,
            0
        );

        shadow.addColorStop(0,
        "rgba(0,0,0,.45)");

        shadow.addColorStop(1,
        "rgba(0,0,0,0)");

        ctx.fillStyle = shadow;

        ctx.fillRect(
            -this.radius,
            -this.radius,
            this.radius*2,
            this.radius
        );

        /* eyelid */

        if(this.blink > 0){

            ctx.fillStyle = "#06090f";

            const close =
            this.radius*1.5*this.blink;

            ctx.fillRect(
                -this.radius*1.2,
                -this.radius,
                this.radius*2.4,
                close
            );

            ctx.fillRect(
                -this.radius*1.2,
                this.radius-close,
                this.radius*2.4,
                close
            );
        }

        ctx.restore();
    }
}

/* =========================
   CREATE EYES
========================= */

const leftEye =
new Eye(
    innerWidth/2 - 170,
    innerHeight/2 - 40
);

const rightEye =
new Eye(
    innerWidth/2 + 170,
    innerHeight/2 - 40
);

let mouseX = innerWidth/2;
let mouseY = innerHeight/2;

window.addEventListener("mousemove",e=>{

    mouseX = e.clientX;
    mouseY = e.clientY;
});

window.addEventListener("touchmove",e=>{

    if(e.touches.length){

        mouseX = e.touches[0].clientX;
        mouseY = e.touches[0].clientY;
    }
});

/* =========================
   BLINK
========================= */

function blink(){

    let t = 0;

    const anim = setInterval(()=>{

        t += 0.16;

        const v =
        Math.sin(t*Math.PI);

        leftEye.blink = v;
        rightEye.blink = v;

        if(t >= 1){

            leftEye.blink = 0;
            rightEye.blink = 0;

            clearInterval(anim);
        }

    },16);
}

setInterval(()=>{

    blink();

},3500 + Math.random()*2500);

/* =========================
   IDLE MOTION
========================= */

setInterval(()=>{

    mouseX =
    innerWidth/2 +
    (Math.random()*260 - 130);

    mouseY =
    innerHeight/2 +
    (Math.random()*140 - 70);

},2600);

/* =========================
   BUTTON
========================= */

const btn =
document.getElementById("scanBtn");

btn.addEventListener("click",()=>{

    blink();

    if(navigator.vibrate){
        navigator.vibrate(50);
    }

    const old = btn.innerText;

    btn.innerText = "SCANNED";

    setTimeout(()=>{

        btn.innerText = old;

    },900);
});

/* =========================
   RENDER
========================= */

function render(){

    ctx.clearRect(0,0,w,h);

    leftEye.update(mouseX,mouseY);
    rightEye.update(mouseX,mouseY);

    leftEye.draw();
    rightEye.draw();

    requestAnimationFrame(render);
}

render();

</script>

</body>
</html>
