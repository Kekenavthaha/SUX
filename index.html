/* =========================

.bg{

<script>

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let w,h;

function resize(){

    w = canvas.width = innerWidth;
    h = canvas.height = innerHeight;
}

resize();

addEventListener('resize',resize);

/* =========================
   EYE CLASS
========================= */

class Eye{

    constructor(x,y){

        this.x = x;
        this.y = y;

        this.radius = Math.min(w,h)*0.14;

        this.irisX = 0;
        this.irisY = 0;

        this.targetX = 0;
        this.targetY = 0;

        this.blink = 0;

        this.micro = 0;
    }

    update(mx,my){

        const dx = mx - this.x;
        const dy = my - this.y;

        const angle = Math.atan2(dy,dx);

        const dist = Math.min(28, Math.hypot(dx,dy)*0.03);

        this.targetX = Math.cos(angle)*dist;
        this.targetY = Math.sin(angle)*dist;

        this.micro += 0.04;

        const mxJitter = Math.sin(this.micro*3.2)*0.5;
        const myJitter = Math.cos(this.micro*2.8)*0.5;

        this.irisX += ((this.targetX+mxJitter)-this.irisX)*0.12;
        this.irisY += ((this.targetY+myJitter)-this.irisY)*0.12;
    }

    draw(){

        ctx.save();

        ctx.translate(this.x,this.y);

        /* =========================
           EYE SHAPE
        ========================= */

        ctx.beginPath();

        ctx.moveTo(-this.radius,0);

        ctx.quadraticCurveTo(
            0,
            -this.radius*0.72,
            this.radius,
            0
        );

        ctx.quadraticCurveTo(
            0,
            this.radius*0.72,
            -this.radius,
            0
        );

        ctx.closePath();

        ctx.clip();

        /* =========================
           WHITE OF EYE
        ========================= */

        const sclera =
        ctx.createRadialGradient(
            0,
            -this.radius*0.2,
            5,
            0,
            0,
            this.radius
        );

        sclera.addColorStop(0,'#ffffff');
        sclera.addColorStop(.45,'#f1f1f1');
        sclera.addColorStop(.75,'#d5d5d5');
        sclera.addColorStop(1,'#a8a8a8');

        ctx.fillStyle = sclera;

        ctx.fillRect(
            -this.radius,
            -this.radius,
            this.radius*2,
            this.radius*2
        );

        /* veins */

        for(let i=0;i<18;i++){

            ctx.beginPath();

            const vx = (Math.random()-0.5)*this.radius*1.6;
            const vy = (Math.random()-0.5)*this.radius*1.1;

            ctx.moveTo(vx,vy);

            ctx.quadraticCurveTo(
                vx+Math.random()*20,
                vy+Math.random()*20,
                vx+Math.random()*40,
                vy+Math.random()*20
            );

            ctx.strokeStyle='rgba(255,80,80,.03)';
            ctx.lineWidth=1;
            ctx.stroke();
        }

        /* =========================
           IRIS
        ========================= */

        const irisR = this.radius*0.42;

        const iris =
        ctx.createRadialGradient(
            this.irisX,
            this.irisY,
            5,
            this.irisX,
            this.irisY,
            irisR
        );

        iris.addColorStop(0,'#d6ffff');
        iris.addColorStop(.15,'#8ef3ff');
        iris.addColorStop(.32,'#48d2ff');
        iris.addColorStop(.6,'#146da1');
        iris.addColorStop(.85,'#07253d');
        iris.addColorStop(1,'#000');

        ctx.beginPath();

        ctx.arc(
            this.irisX,
            this.irisY,
            irisR,
            0,
            Math.PI*2
        );

        ctx.fillStyle = iris;
        ctx.fill();

        /* iris detail lines */

        for(let i=0;i<140;i++){

            const a = (Math.PI*2/140)*i;

            const len = irisR*(0.65 + Math.random()*0.35);

            ctx.beginPath();

            ctx.moveTo(
                this.irisX,
                this.irisY
            );

            ctx.lineTo(
                this.irisX + Math.cos(a)*len,
                this.irisY + Math.sin(a)*len
            );

            ctx.strokeStyle =
            `rgba(255,255,255,${0.03+Math.random()*0.05})`;

            ctx.lineWidth = 1;

            ctx.stroke();
        }

        /* outer ring */

        ctx.beginPath();

        ctx.arc(
            this.irisX,
            this.irisY,
            irisR,
            0,
            Math.PI*2
        );

        ctx.lineWidth = 5;

        ctx.strokeStyle = 'rgba(0,0,0,.45)';

        ctx.stroke();

        /* =========================
           PUPIL
        ========================= */

        ctx.beginPath();

        ctx.arc(
            this.irisX,
            this.irisY,
            irisR*0.24,
            0,
            Math.PI*2
        );

        ctx.fillStyle = '#000';

        ctx.shadowBlur = 20;
        ctx.shadowColor = 'rgba(0,0,0,.9)';

        ctx.fill();

        ctx.shadowBlur = 0;

        /* =========================
           CORNEA REFLECTION
        ========================= */

        const gloss =
        ctx.createRadialGradient(
            this.irisX-irisR*0.2,
            this.irisY-irisR*0.25,
            2,
            this.irisX,
            this.irisY,
            irisR
        );

        gloss.addColorStop(0,'rgba(255,255,255,.85)');
        gloss.addColorStop(.25,'rgba(255,255,255,.22)');
        gloss.addColorStop(1,'rgba(255,255,255,0)');

        ctx.beginPath();

        ctx.arc(
            this.irisX,
            this.irisY,
            irisR,
            0,
            Math.PI*2
        );

        ctx.fillStyle = gloss;
        ctx.fill();

        /* small bright reflection */

        ctx.beginPath();

        ctx.arc(
            this.irisX - irisR*0.25,
            this.irisY - irisR*0.25,
            irisR*0.08,
            0,
            Math.PI*2
        );

        ctx.fillStyle='rgba(255,255,255,.95)';
        ctx.fill();

        /* =========================
           SHADOWS
        ========================= */

        const shadow =
        ctx.createLinearGradient(
            0,
            -this.radius,
            0,
            this.radius
        );

        shadow.addColorStop(0,'rgba(0,0,0,.55)');
        shadow.addColorStop(.4,'rgba(0,0,0,0)');
        shadow.addColorStop(1,'rgba(0,0,0,.15)');

        ctx.fillStyle = shadow;

        ctx.fillRect(
            -this.radius,
            -this.radius,
            this.radius*2,
            this.radius*2
        );

        /* =========================
           WET LOWER EDGE
        ========================= */

        ctx.beginPath();

        ctx.ellipse(
            0,
            this.radius*0.42,
            this.radius*0.6,
            this.radius*0.06,
            0,
            0,
            Math.PI*2
        );

        const wet =
        ctx.createLinearGradient(
            0,
            this.radius*0.35,
            0,
            this.radius*0.5
        );

        wet.addColorStop(0,'rgba(255,255,255,.4)');
        wet.addColorStop(1,'rgba(255,255,255,0)');

        ctx.fillStyle = wet;
        ctx.fill();

        /* =========================
           EYELIDS
        ========================= */

        if(this.blink > 0){

            ctx.fillStyle = '#06090f';

            const close =
            this.radius*1.55*this.blink;

            ctx.fillRect(
                -this.radius*1.3,
                -this.radius,
                this.radius*2.6,
                close
            );

            ctx.fillRect(
                -this.radius*1.3,
                this.radius-close,
                this.radius*2.6,
                close
            );
        }

        ctx.restore();
    }
}

/* =========================
   CREATE EYES
========================= */

const leftEye = new Eye(
    innerWidth/2 - 220,
    innerHeight/2 - 50
);

const rightEye = new Eye(
    innerWidth/2 + 220,
    innerHeight/2 - 50
);

let mouseX = innerWidth/2;
let mouseY = innerHeight/2;

window.addEventListener('mousemove',e=>{

    mouseX = e.clientX;
    mouseY = e.clientY;
});

window.addEventListener('touchmove',e=>{

    if(e.touches.length){

        mouseX = e.touches[0].clientX;
        mouseY = e.touches[0].clientY;
    }
});

/* =========================
   BLINK SYSTEM
========================= */

function blink(){

    let t = 0;

    const anim = setInterval(()=>{

        t += 0.12;

        const v = Math.sin(t*Math.PI);

        leftEye.blink = v;
        rightEye.blink = v;

        if(t >= 1){

            leftEye.blink = 0;
            rightEye.blink = 0;

            clearInterval(anim);
        }

    },16);
}

setInterval(()=>{

    blink();

},3000 + Math.random()*2500);

/* =========================
   IDLE LOOKING
========================= */

setInterval(()=>{

    mouseX =
    innerWidth/2 +
    (Math.random()*400 - 200);

    mouseY =
    innerHeight/2 +
    (Math.random()*180 - 90);

},2800);

/* =========================
   BUTTON
========================= */

const btn = document.getElementById('scanBtn');

btn.addEventListener('click',()=>{

    blink();

    if(navigator.vibrate){
        navigator.vibrate(60);
    }

    const old = btn.innerText;

    btn.innerText = 'TARGET LOCKED';

    setTimeout(()=>{

        btn.innerText = old;

    },1000);
});

/* =========================
   RENDER LOOP
========================= */

function render(){

    ctx.clearRect(0,0,w,h);

    leftEye.update(mouseX,mouseY);
    rightEye.update(mouseX,mouseY);

    leftEye.draw();
    rightEye.draw();

    requestAnimationFrame(render);
}

render();

</script>
</body>
