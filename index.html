<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SUX — гиперреалистичные глаза</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: #0a0c12;
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
            overflow: hidden;
            position: relative;
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, #1a1a2e, #0a0a14);
            animation: slowDrift 20s infinite alternate;
            z-index: 0;
        }
        @keyframes slowDrift {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 20%; }
        }

        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIj48ZmlsdGVyIGlkPSJmIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iLjgiIG51bU9jdGF2ZXM9IjMiLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWx0ZXI9InVybCgjZikiIG9wYWNpdHk9IjAuMDgiLz48L3N2Zz4=');
            background-repeat: repeat;
            opacity: 0.25;
            pointer-events: none;
            z-index: 1;
        }
        .grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(255, 50, 50, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 50, 50, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
            z-index: 1;
        }

        .eyes-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8vw;
            z-index: 2;
            pointer-events: none;
        }

        canvas {
            width: min(280px, 35vw);
            height: min(280px, 35vw);
            pointer-events: auto;
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(0,0,0,0.5), 0 0 0 2px rgba(255,200,150,0.2);
            transition: box-shadow 0.2s;
        }
        canvas:hover {
            box-shadow: 0 0 60px rgba(255,80,80,0.3);
        }

        .sux-brand {
            position: fixed;
            bottom: 12%;
            left: 0;
            right: 0;
            text-align: center;
            font-size: clamp(36px, 12vw, 90px);
            font-weight: 900;
            letter-spacing: 8px;
            color: rgba(255, 70, 70, 0.7);
            text-shadow: 0 0 20px rgba(255,0,0,0.4);
            font-family: monospace;
            z-index: 3;
            pointer-events: none;
        }
        .slogan {
            position: fixed;
            bottom: 5%;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 12px;
            color: rgba(255,200,200,0.5);
            font-family: monospace;
            z-index: 3;
            pointer-events: none;
        }
        .demo-btn {
            position: fixed;
            bottom: 25px;
            right: 20px;
            background: #b33;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 12px 24px;
            font-weight: bold;
            z-index: 10;
            cursor: pointer;
            font-family: inherit;
            transition: 0.1s;
            pointer-events: auto;
        }
        .demo-btn:active {
            transform: scale(0.96);
        }

        @media (max-width: 600px) {
            .eyes-container { gap: 5vw; }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="noise"></div>
    <div class="grid"></div>

    <div class="eyes-container">
        <canvas id="leftEyeCanvas" width="800" height="800" style="width:100%; height:auto; max-width:300px; aspect-ratio:1/1"></canvas>
        <canvas id="rightEyeCanvas" width="800" height="800" style="width:100%; height:auto; max-width:300px; aspect-ratio:1/1"></canvas>
    </div>

    <div class="sux-brand">SUX</div>
    <div class="slogan">видит каждый твой вздох</div>
    <button class="demo-btn" id="actionBtn">👁️ Нажать</button>

    <script>
        (function() {
            const SIZE = 800;
            const leftCanvas = document.getElementById('leftEyeCanvas');
            const rightCanvas = document.getElementById('rightEyeCanvas');
            const ctxLeft = leftCanvas.getContext('2d');
            const ctxRight = rightCanvas.getContext('2d');

            // Параметры смещения радужки
            let leftIrisOffset = { x: 0, y: 0 };
            let rightIrisOffset = { x: 0, y: 0 };
            const MAX_OFFSET = 45;

            // Моргание
            let blinkProgress = 0;            // 0..1 (0 – открыт, 1 – закрыт)
            let isBlinking = false;
            let blinkStartTime = 0;
            const BLINK_DURATION = 200;       // мс, плавная анимация

            // Обновление направления взгляда по координатам указателя
            function updateGaze(clientX, clientY) {
                const winW = window.innerWidth;
                const winH = window.innerHeight;
                const centerX = winW / 2;
                const centerY = winH / 2;
                let dx = (clientX - centerX) / (winW / 2);
                let dy = (clientY - centerY) / (winH / 2);
                dx = Math.min(0.8, Math.max(-0.8, dx));
                dy = Math.min(0.6, Math.max(-0.6, dy));
                const offsetX = dx * MAX_OFFSET;
                const offsetY = dy * MAX_OFFSET;
                leftIrisOffset = { x: offsetX, y: offsetY };
                rightIrisOffset = { x: offsetX, y: offsetY };
            }

            // Плавное моргание с easing (ease-in-out) и максимальной непрозрачностью 0.3
            function startBlink() {
                if (isBlinking) return;
                isBlinking = true;
                blinkStartTime = performance.now();

                function animateBlink(now) {
                    const elapsed = now - blinkStartTime;
                    if (elapsed >= BLINK_DURATION) {
                        blinkProgress = 0;
                        isBlinking = false;
                        drawEyes();
                        return;
                    }
                    const t = elapsed / BLINK_DURATION;
                    // easeInOutQuad
                    if (t < 0.5) {
                        blinkProgress = 2 * t * t;
                    } else {
                        blinkProgress = 1 - Math.pow(-2 * t + 2, 2) / 2;
                    }
                    drawEyes();
                    requestAnimationFrame(animateBlink);
                }
                requestAnimationFrame(animateBlink);
            }

            // Автоматическое моргание каждые 3–7 секунд
            function scheduleRandomBlink() {
                const delay = 3000 + Math.random() * 4000;
                setTimeout(() => {
                    startBlink();
                    scheduleRandomBlink();
                }, delay);
            }

            // ---------- РИСОВАНИЕ ГЛАЗА (реалистичный порядок слоёв) ----------
            function drawRealisticEye(ctx, irisOffsetX, irisOffsetY, isLeft) {
                const cx = SIZE / 2;
                const cy = SIZE / 2;
                const eyeRadius = SIZE * 0.42;
                const irisRadius = SIZE * 0.22;
                const pupilRadius = SIZE * 0.09;

                // --- 1. Склера (белок) ---
                ctx.save();
                ctx.beginPath();
                ctx.ellipse(cx, cy, eyeRadius, eyeRadius * 0.85, 0, 0, Math.PI * 2);
                ctx.fillStyle = "#f5f2ed";
                ctx.fill();
                // Тень от верхнего века (постоянная)
                ctx.beginPath();
                ctx.ellipse(cx, cy - eyeRadius * 0.15, eyeRadius * 0.98, eyeRadius * 0.25, 0, Math.PI, 0, true);
                ctx.fillStyle = "rgba(0,0,0,0.07)";
                ctx.fill();
                // Тень от нижнего века
                ctx.beginPath();
                ctx.ellipse(cx, cy + eyeRadius * 0.1, eyeRadius * 0.98, eyeRadius * 0.2, 0, 0, Math.PI, false);
                ctx.fillStyle = "rgba(0,0,0,0.04)";
                ctx.fill();

                // Прожилки (красноватые)
                ctx.globalAlpha = 0.22;
                for (let i = 0; i < 16; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const rad = eyeRadius * 0.55;
                    const x1 = cx + Math.cos(angle) * rad;
                    const y1 = cy + Math.sin(angle) * rad;
                    const x2 = cx + Math.cos(angle + (Math.random() - 0.5) * 0.5) * (rad + 18);
                    const y2 = cy + Math.sin(angle + (Math.random() - 0.5) * 0.5) * (rad + 18);
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.strokeStyle = `rgba(180,70,70,${Math.random() * 0.25 + 0.05})`;
                    ctx.lineWidth = 1.4;
                    ctx.stroke();
                }
                ctx.globalAlpha = 1.0;
                ctx.restore();

                // --- 2. Радужка и зрачок (под веками, чтобы веки их перекрывали) ---
                const irisX = cx + irisOffsetX;
                const irisY = cy + irisOffsetY;

                // Радужка с градиентом и деталями
                ctx.save();
                const gradIris = ctx.createRadialGradient(irisX - 6, irisY - 6, 2, irisX, irisY, irisRadius);
                gradIris.addColorStop(0, '#5a3e2b');
                gradIris.addColorStop(0.4, '#8b5e3c');
                gradIris.addColorStop(0.75, '#3a4a5a');
                gradIris.addColorStop(0.92, '#1a2a3a');
                gradIris.addColorStop(1, '#0a0a12');      // тёмное лимбальное кольцо
                ctx.beginPath();
                ctx.arc(irisX, irisY, irisRadius, 0, Math.PI * 2);
                ctx.fillStyle = gradIris;
                ctx.fill();

                // Радиальные волокна (текстура радужки)
                ctx.globalAlpha = 0.25;
                ctx.translate(irisX, irisY);
                for (let i = 0; i < 100; i++) {
                    const angle = (i / 100) * Math.PI * 2;
                    const len1 = irisRadius * 0.35;
                    const len2 = irisRadius * (0.65 + Math.random() * 0.2);
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(angle) * len1, Math.sin(angle) * len1);
                    ctx.lineTo(Math.cos(angle) * len2, Math.sin(angle) * len2);
                    ctx.strokeStyle = `rgba(40,20,10,${0.15 + Math.random() * 0.25})`;
                    ctx.lineWidth = 1.2;
                    ctx.stroke();
                }
                // Мелкие крапинки
                for (let i = 0; i < 70; i++) {
                    const a = Math.random() * Math.PI * 2;
                    const r = irisRadius * (0.25 + Math.random() * 0.65);
                    ctx.beginPath();
                    ctx.arc(Math.cos(a) * r, Math.sin(a) * r, Math.random() * 2 + 0.4, 0, 2 * Math.PI);
                    ctx.fillStyle = `rgba(60,30,10,${Math.random() * 0.35})`;
                    ctx.fill();
                }
                ctx.setTransform(1, 0, 0, 1, 0, 0); // сброс трансформации
                ctx.globalAlpha = 1.0;

                // Зрачок
                ctx.beginPath();
                ctx.arc(irisX, irisY, pupilRadius, 0, Math.PI * 2);
                ctx.fillStyle = '#050508';
                ctx.fill();

                // Блики на роговице (отражения)
                ctx.beginPath();
                ctx.arc(irisX - pupilRadius * 0.5, irisY - pupilRadius * 0.5, pupilRadius * 0.32, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(255,255,250,0.92)";
                ctx.fill();
                ctx.beginPath();
                ctx.arc(irisX + pupilRadius * 0.25, irisY + pupilRadius * 0.2, pupilRadius * 0.15, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(255,255,220,0.8)";
                ctx.fill();
                ctx.restore();

                // --- 3. Веки (рисуются поверх глазного яблока) ---
                // Верхнее веко
                ctx.save();
                ctx.beginPath();
                ctx.ellipse(cx, cy - eyeRadius * 0.15, eyeRadius * 1.02, eyeRadius * 0.45, 0, 0, Math.PI * 2);
                const gradUpper = ctx.createLinearGradient(cx, cy - eyeRadius * 0.6, cx, cy + eyeRadius * 0.3);
                gradUpper.addColorStop(0, '#c8b594');
                gradUpper.addColorStop(0.7, '#a88b6c');
                ctx.fillStyle = gradUpper;
                ctx.fill();
                // Тень под верхним веком на глазном яблоке (дополнительный объём)
                ctx.beginPath();
                ctx.ellipse(cx, cy - eyeRadius * 0.12, eyeRadius * 0.98, eyeRadius * 0.28, 0, Math.PI, 0, true);
                ctx.fillStyle = "rgba(0,0,0,0.08)";
                ctx.fill();
                ctx.restore();

                // Нижнее веко
                ctx.save();
                ctx.beginPath();
                ctx.ellipse(cx, cy + eyeRadius * 0.12, eyeRadius * 1.02, eyeRadius * 0.4, 0, 0, Math.PI * 2);
                const gradLower = ctx.createLinearGradient(cx, cy + eyeRadius * 0.6, cx, cy - eyeRadius * 0.3);
                gradLower.addColorStop(0, '#bca586');
                gradLower.addColorStop(0.7, '#d9c8b0');
                ctx.fillStyle = gradLower;
                ctx.fill();
                ctx.restore();

                // --- 4. Ресницы (над веками) ---
                ctx.save();
                ctx.strokeStyle = "#1a1510";
                // Верхние ресницы
                ctx.lineWidth = 2.2;
                for (let i = 0; i < 28; i++) {
                    const baseAngle = -Math.PI / 2 + (i - 14) * 0.1;
                    const baseX = cx + Math.cos(baseAngle) * (eyeRadius - 4);
                    const baseY = cy + Math.sin(baseAngle) * (eyeRadius * 0.85) - 3;
                    const tipAngle = baseAngle - 0.4 + (Math.random() - 0.5) * 0.3;
                    const len = 10 + Math.random() * 8;
                    const tipX = baseX + Math.cos(tipAngle) * len;
                    const tipY = baseY + Math.sin(tipAngle) * len;
                    ctx.beginPath();
                    ctx.moveTo(baseX, baseY);
                    ctx.lineTo(tipX, tipY);
                    ctx.stroke();
                }
                // Нижние ресницы
                ctx.lineWidth = 1.7;
                for (let i = 0; i < 20; i++) {
                    const baseAngle = Math.PI / 2 + (i - 10) * 0.1;
                    const baseX = cx + Math.cos(baseAngle) * (eyeRadius - 3);
                    const baseY = cy + Math.sin(baseAngle) * (eyeRadius * 0.8) + 2;
                    const tipAngle = baseAngle + 0.4 + (Math.random() - 0.5) * 0.3;
                    const len = 5 + Math.random() * 6;
                    const tipX = baseX + Math.cos(tipAngle) * len;
                    const tipY = baseY + Math.sin(tipAngle) * len;
                    ctx.beginPath();
                    ctx.moveTo(baseX, baseY);
                    ctx.lineTo(tipX, tipY);
                    ctx.stroke();
                }
                ctx.restore();

                // --- 5. Влажные блики по краю век ---
                ctx.save();
                ctx.globalAlpha = 0.25;
                for (let i = 0; i < 10; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const r = eyeRadius - 4;
                    const x = cx + Math.cos(angle) * r;
                    const y = cy + Math.sin(angle) * r * 0.85;
                    ctx.beginPath();
                    ctx.arc(x, y, 1.5, 0, 2 * Math.PI);
                    ctx.fillStyle = "white";
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
                ctx.restore();

                // --- 6. Анимированное моргание (полупрозрачные веки) ---
                if (blinkProgress > 0.005) {
                    const alpha = Math.min(0.3, blinkProgress * 0.3); // максимальная непрозрачность 30%
                    // Верхнее веко опускается
                    const upperY = cy - eyeRadius * 0.85 + blinkProgress * eyeRadius * 1.7;
                    ctx.save();
                    ctx.beginPath();
                    ctx.ellipse(cx, upperY, eyeRadius * 1.05, eyeRadius * 0.8, 0, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(200, 170, 130, ${alpha})`;
                    ctx.fill();
                    ctx.restore();
                    // Нижнее веко поднимается
                    const lowerY = cy + eyeRadius * 0.85 - blinkProgress * eyeRadius * 1.7;
                    ctx.save();
                    ctx.beginPath();
                    ctx.ellipse(cx, lowerY, eyeRadius * 1.05, eyeRadius * 0.8, 0, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(190, 160, 120, ${alpha})`;
                    ctx.fill();
                    ctx.restore();
                }
            }

            // Перерисовка обоих глаз
            function drawEyes() {
                ctxLeft.clearRect(0, 0, SIZE, SIZE);
                ctxRight.clearRect(0, 0, SIZE, SIZE);
                drawRealisticEye(ctxLeft, leftIrisOffset.x, leftIrisOffset.y, true);
                drawRealisticEye(ctxRight, rightIrisOffset.x, rightIrisOffset.y, false);
            }

            // Обработка движения курсора / пальца
            function onPointerMove(e) {
                let clientX, clientY;
                if (e.touches) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                updateGaze(clientX, clientY);
                drawEyes();
            }

            // Инициализация
            function init() {
                updateGaze(window.innerWidth / 2, window.innerHeight / 2);
                drawEyes();

                window.addEventListener('mousemove', onPointerMove);
                window.addEventListener('touchmove', onPointerMove, { passive: true });
                window.addEventListener('touchstart', onPointerMove, { passive: true });

                scheduleRandomBlink();

                document.getElementById('actionBtn').addEventListener('click', () => {
                    startBlink();
                    if (navigator.vibrate) navigator.vibrate(50);
                });

                window.addEventListener('resize', () => {
                    updateGaze(window.innerWidth / 2, window.innerHeight / 2);
                    drawEyes();
                });
            }

            init();
        })();
    </script>
</body>
</html>
