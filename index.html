<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>SUX — Ether Link</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
}

body{
    overflow:hidden;
    background:#060914;
    font-family:Segoe UI,sans-serif;
    color:white;
}

/* =====================================================
   BACKGROUND
===================================================== */

.bg{
    position:fixed;
    inset:0;

    background:
    radial-gradient(circle at top left,
    rgba(90,140,255,.18),
    transparent 35%),

    radial-gradient(circle at bottom right,
    rgba(160,90,255,.12),
    transparent 40%),

    linear-gradient(
    135deg,
    #050814,
    #091120,
    #060b15);

    animation:bgFlow 18s ease infinite alternate;
}

@keyframes bgFlow{

    from{
        transform:scale(1);
        filter:hue-rotate(0deg);
    }

    to{
        transform:scale(1.04);
        filter:hue-rotate(20deg);
    }
}

.grid{
    position:fixed;
    inset:0;

    background-image:
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);

    background-size:48px 48px;

    opacity:.35;
}

.vignette{
    position:fixed;
    inset:0;

    background:
    radial-gradient(circle,
    transparent 50%,
    rgba(0,0,0,.6) 100%);
}

/* =====================================================
   THREE
===================================================== */

#three-container{
    position:fixed;
    inset:0;

    z-index:3;

    pointer-events:none;
}

/* =====================================================
   LOGO
===================================================== */

.logo{
    position:fixed;

    width:100%;
    bottom:13%;

    text-align:center;

    font-size:92px;
    font-weight:900;

    font-family:monospace;

    letter-spacing:14px;

    background:
    linear-gradient(
    135deg,
    #eef6ff,
    #9dbdff);

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    text-shadow:
    0 0 25px rgba(100,160,255,.15);

    z-index:5;

    transition:.25s;
}

.slogan{
    position:fixed;

    width:100%;
    bottom:8%;

    text-align:center;

    font-size:12px;

    letter-spacing:4px;

    color:rgba(200,220,255,.55);

    z-index:5;

    transition:.25s;
}

.hidden{
    opacity:0;
    pointer-events:none;
}

/* =====================================================
   TOP BAR
===================================================== */

.top-bar{
    position:fixed;

    top:16px;
    left:16px;
    right:16px;

    padding:14px 20px;

    border-radius:999px;

    background:
    rgba(15,20,35,.55);

    border:
    1px solid rgba(140,170,255,.22);

    backdrop-filter:blur(22px);

    display:flex;
    justify-content:space-between;
    align-items:center;

    z-index:10;

    transition:.25s;
}

.user{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:34px;
    height:34px;

    border-radius:50%;

    background:
    linear-gradient(
    135deg,
    #5f87ff,
    #7f5fff);

    display:flex;
    align-items:center;
    justify-content:center;
}

.balance{
    color:#ffe08c;
    font-weight:700;
}

/* =====================================================
   CONTENT
===================================================== */

.content{
    position:fixed;

    top:90px;
    left:16px;
    right:16px;
    bottom:100px;

    background:
    rgba(0,0,0,.35);

    border-radius:34px;

    border:
    1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(18px);

    padding:24px;

    overflow:auto;

    z-index:10;

    transition:.25s;
}

.card{
    background:
    rgba(255,255,255,.05);

    border-radius:26px;

    padding:20px;

    margin-bottom:14px;

    border:
    1px solid rgba(255,255,255,.06);
}

/* =====================================================
   BOTTOM
===================================================== */

.bottom{
    position:fixed;

    left:16px;
    right:16px;
    bottom:18px;

    padding:10px;

    border-radius:36px;

    background:
    rgba(12,18,30,.72);

    backdrop-filter:blur(24px);

    border:
    1px solid rgba(120,160,255,.2);

    z-index:10;
}

.menu{
    display:flex;
    gap:8px;
}

.tab{
    flex:1;

    border:none;

    background:transparent;

    color:rgba(255,255,255,.55);

    padding:12px;

    border-radius:24px;

    cursor:pointer;

    transition:.15s;
}

.tab.active{
    background:
    rgba(120,160,255,.14);

    color:#b6ceff;
}

</style>
</head>
<body>

<div class="bg"></div>
<div class="grid"></div>
<div class="vignette"></div>

<div id="three-container"></div>

<div class="logo" id="logo">
SUX
</div>

<div class="slogan" id="slogan">
PRESENCE • FLOW • HARMONY
</div>

<div class="top-bar hidden"
id="topBar">

    <div class="user">

        <div class="avatar">
        🦀
        </div>

        <div>
        Краб Гражданин
        </div>

    </div>

    <div class="balance">
    12 500 кр.
    </div>

</div>

<div class="content hidden"
id="content">

    <div class="card">
        <h2>ЭФИРНАЯ СЕТЬ</h2>
        <br>
        <div>
        Подключение стабильно.
        </div>
    </div>

</div>

<div class="bottom">

    <div class="menu">

        <button class="tab active"
        data-tab="home">
        🏠
        </button>

        <button class="tab"
        data-tab="profile">
        👤
        </button>

        <button class="tab"
        data-tab="bank">
        🏦
        </button>

        <button class="tab"
        data-tab="darknet">
        🕶️
        </button>

        <button class="tab"
        data-tab="court">
        ⚖️
        </button>

        <button class="tab"
        data-tab="housing">
        🏙️
        </button>

    </div>

</div>

<!-- =====================================================
     THREE JS
===================================================== -->

<script type="importmap">
{
    "imports": {
        "three":
        "https://unpkg.com/three@0.128.0/build/three.module.js"
    }
}
</script>

<script type="module">

import * as THREE from 'three';

/* =====================================================
   SCENE
===================================================== */

const container =
document.getElementById(
'three-container'
);

const scene =
new THREE.Scene();

const camera =
new THREE.PerspectiveCamera(
    45,
    innerWidth/innerHeight,
    0.1,
    1000
);

camera.position.z = 4;

const renderer =
new THREE.WebGLRenderer({

    antialias:true,
    alpha:true
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.setClearColor(
    0x000000,
    0
);

container.appendChild(
    renderer.domElement
);

/* =====================================================
   ORB GROUP
===================================================== */

const orbGroup =
new THREE.Group();

scene.add(orbGroup);

/* =====================================================
   MAIN SPHERE
===================================================== */

const geometry =
new THREE.IcosahedronGeometry(
    1.1,
    32
);

const material =
new THREE.ShaderMaterial({

    uniforms:{
        uTime:{ value:0 }
    },

    vertexShader:`

        uniform float uTime;

        varying vec3 vNormal;

        void main(){

            vNormal = normal;

            vec3 pos = position;

            float wave =
            sin(pos.y * 4.0 + uTime * 1.6)
            *
            cos(pos.x * 3.0 - uTime);

            pos +=
            normal *
            wave *
            0.05;

            gl_Position =
            projectionMatrix *
            modelViewMatrix *
            vec4(pos,1.0);
        }
    `,

    fragmentShader:`

        uniform float uTime;

        varying vec3 vNormal;

        void main(){

            float fresnel =
            pow(
                1.0 -
                dot(
                    normalize(vNormal),
                    vec3(0.0,0.0,1.0)
                ),
                2.2
            );

            vec3 c1 =
            vec3(
                0.35,
                0.65,
                1.0
            );

            vec3 c2 =
            vec3(
                0.65,
                0.4,
                1.0
            );

            float pulse =
            sin(uTime * 1.5) * .5 + .5;

            vec3 color =
            mix(c1,c2,pulse);

            color += fresnel * 0.45;

            gl_FragColor =
            vec4(
                color,
                0.95
            );
        }
    `,

    transparent:true,
    blending:
    THREE.AdditiveBlending
});

const orb =
new THREE.Mesh(
    geometry,
    material
);

orbGroup.add(orb);

/* =====================================================
   GLOW
===================================================== */

const glowGeometry =
new THREE.SphereGeometry(
    1.6,
    64,
    64
);

const glowMaterial =
new THREE.ShaderMaterial({

    vertexShader:`

        varying vec3 vNormal;

        void main(){

            vNormal =
            normalize(
                normalMatrix *
                normal
            );

            gl_Position =
            projectionMatrix *
            modelViewMatrix *
            vec4(position,1.0);
        }
    `,

    fragmentShader:`

        varying vec3 vNormal;

        void main(){

            float intensity =
            pow(
                0.8 -
                dot(
                    vNormal,
                    vec3(0,0,1)
                ),
                3.0
            );

            gl_FragColor =
            vec4(
                0.45,
                0.65,
                1.0,
                intensity * 0.25
            );
        }
    `,

    side:THREE.BackSide,
    transparent:true,
    blending:
    THREE.AdditiveBlending
});

const glow =
new THREE.Mesh(
    glowGeometry,
    glowMaterial
);

orbGroup.add(glow);

/* =====================================================
   PARTICLES
===================================================== */

const particlesCount = 4500;

const particlesGeometry =
new THREE.BufferGeometry();

const positions =
new Float32Array(
    particlesCount * 3
);

for(let i=0;i<particlesCount;i++){

    const radius =
    1.5 + Math.random()*1.2;

    const theta =
    Math.random()*Math.PI*2;

    const phi =
    Math.acos(
        (Math.random()*2)-1
    );

    positions[i*3] =
    radius *
    Math.sin(phi) *
    Math.cos(theta);

    positions[i*3+1] =
    radius *
    Math.sin(phi) *
    Math.sin(theta);

    positions[i*3+2] =
    radius *
    Math.cos(phi);
}

particlesGeometry.setAttribute(

    'position',

    new THREE.BufferAttribute(
        positions,
        3
    )
);

const particlesMaterial =
new THREE.PointsMaterial({

    color:0xaaccff,
    size:0.018,
    transparent:true,
    opacity:0.6,

    blending:
    THREE.AdditiveBlending,

    depthWrite:false
});

const particles =
new THREE.Points(

    particlesGeometry,
    particlesMaterial
);

orbGroup.add(particles);

/* =====================================================
   LIGHTS
===================================================== */

const ambient =
new THREE.AmbientLight(
    0xffffff,
    0.25
);

scene.add(ambient);

const light =
new THREE.PointLight(
    0x88bbff,
    2,
    10
);

light.position.set(
    2,
    2,
    3
);

scene.add(light);

/* =====================================================
   MOUSE
===================================================== */

let mouseX = 0;
let mouseY = 0;

addEventListener(
    'mousemove',
    e=>{

        mouseX =
        (e.clientX /
        innerWidth - .5);

        mouseY =
        (e.clientY /
        innerHeight - .5);
    }
);

/* =====================================================
   ANIMATE
===================================================== */

const clock =
new THREE.Clock();

function animate(){

    requestAnimationFrame(
        animate
    );

    const t =
    clock.getElapsedTime();

    material.uniforms
    .uTime.value = t;

    const breathe =
    1 +
    Math.sin(t * 1.8)
    * 0.03;

    orbGroup.scale.set(
        breathe,
        breathe,
        breathe
    );

    orb.rotation.y +=
    0.0012;

    particles.rotation.y -=
    0.0004;

    orbGroup.rotation.y +=
    ((mouseX * 0.25)
    -
    orbGroup.rotation.y)
    * 0.03;

    orbGroup.rotation.x +=
    ((-mouseY * 0.2)
    -
    orbGroup.rotation.x)
    * 0.03;

    orbGroup.position.y =
    Math.sin(t * 1.2)
    * 0.08;

    renderer.render(
        scene,
        camera
    );
}

animate();

/* =====================================================
   RESIZE
===================================================== */

addEventListener(
    'resize',
    ()=>{

        camera.aspect =
        innerWidth /
        innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

/* =====================================================
   UI
===================================================== */

const tabs =
document.querySelectorAll('.tab');

const logo =
document.getElementById('logo');

const slogan =
document.getElementById('slogan');

const topBar =
document.getElementById('topBar');

const content =
document.getElementById('content');

function setTab(tab){

    tabs.forEach(btn=>{

        btn.classList.remove(
            'active'
        );

        if(
            btn.dataset.tab
            === tab
        ){

            btn.classList.add(
                'active'
            );
        }
    });

    if(tab === 'home'){

        container.style.opacity =
        '1';

        logo.classList.remove(
            'hidden'
        );

        slogan.classList.remove(
            'hidden'
        );

        topBar.classList.add(
            'hidden'
        );

        content.classList.add(
            'hidden'
        );

    }else{

        container.style.opacity =
        '.15';

        logo.classList.add(
            'hidden'
        );

        slogan.classList.add(
            'hidden'
        );

        topBar.classList.remove(
            'hidden'
        );

        content.classList.remove(
            'hidden'
        );
    }
}

tabs.forEach(btn=>{

    btn.addEventListener(
        'click',
        ()=>{

            setTab(
                btn.dataset.tab
            );
        }
    );
});

setTab('home');

</script>
</body>
</html>
