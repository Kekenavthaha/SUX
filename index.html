<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>SUX — Ether Core</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
}

body{
    overflow:hidden;
    background:#050816;
    font-family:Inter,Segoe UI,sans-serif;
    color:white;
}

/* =========================
   CINEMATIC BACKGROUND
========================= */

.bg{
    position:fixed;
    inset:0;

    background:
    radial-gradient(circle at 50% 30%,
    rgba(50,80,180,.08),
    transparent 40%),


    radial-gradient(circle at 70% 70%,
    rgba(120,40,180,.05),
    transparent 45%),


    linear-gradient(
    180deg,
    #060816,
    #040611,
    #02040b);

    animation:bgMove 18s ease-in-out infinite alternate;
}

@keyframes bgMove{

    from{
        transform:scale(1);
        filter:hue-rotate(0deg);
    }

    to{
        transform:scale(1.04);
        filter:hue-rotate(8deg);
    }
}

/* =========================
   SOFT FOG
========================= */

.fog{
    position:fixed;
    inset:0;

    background:
    radial-gradient(circle at center,
    transparent 30%,
    rgba(0,0,0,.22) 100%);

    z-index:2;
}

/* =========================
   VISUALIZER
========================= */

#visualizer{
    position:fixed;
    inset:0;
    z-index:3;
    pointer-events:none;
}

/* =========================
   LOGO
========================= */

.logo{
    position:fixed;

    bottom:13%;
    width:100%;

    text-align:center;

    font-size:72px;
    font-weight:800;

    letter-spacing:12px;

    font-family:monospace;

    background:
    linear-gradient(
    180deg,
    #dfe8ff,
    #8ea3ff);

    -webkit-background-clip:text;
    color:transparent;

    opacity:.95;

    z-index:5;

    transition:.25s;
}

.slogan{
    position:fixed;

    width:100%;
    bottom:8%;

    text-align:center;

    color:rgba(180,190,255,.42);

    letter-spacing:3px;

    font-size:12px;

    z-index:5;

    transition:.25s;
}

.hidden{
    opacity:0;
    pointer-events:none;
}

/* =========================
   TOP BAR
========================= */

.top-bar{
    position:fixed;

    top:16px;
    left:16px;
    right:16px;

    padding:12px 18px;

    border-radius:999px;

    background:
    rgba(12,16,30,.55);

    backdrop-filter:blur(24px);

    border:
    1px solid rgba(120,140,255,.14);

    display:flex;
    justify-content:space-between;
    align-items:center;

    z-index:10;
}

.user{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:34px;
    height:34px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
    linear-gradient(
    145deg,
    #3b4da8,
    #1f2f73);
}

.balance{
    color:#cbd5ff;
    font-weight:700;
}

/* =========================
   CONTENT
========================= */

.content{
    position:fixed;

    top:90px;
    left:16px;
    right:16px;
    bottom:100px;

    padding:20px;

    overflow:auto;

    border-radius:32px;

    background:
    rgba(8,12,24,.45);

    backdrop-filter:blur(18px);

    border:
    1px solid rgba(140,160,255,.1);

    z-index:10;
}

.card{
    background:
    rgba(255,255,255,.03);

    border-radius:24px;

    padding:18px;

    margin-bottom:14px;

    border:
    1px solid rgba(255,255,255,.04);
}

/* =========================
   BOTTOM NAV
========================= */

.bottom{
    position:fixed;

    left:16px;
    right:16px;
    bottom:18px;

    padding:10px;

    border-radius:40px;

    background:
    rgba(12,16,30,.62);

    backdrop-filter:blur(24px);

    border:
    1px solid rgba(120,140,255,.14);

    z-index:10;
}

.menu{
    display:flex;
    gap:8px;
}

.tab{
    flex:1;

    border:none;
    background:transparent;

    color:
    rgba(255,255,255,.45);

    padding:12px;

    border-radius:24px;

    cursor:pointer;

    transition:.18s;
}

.tab.active{
    background:
    rgba(90,110,255,.12);

    color:#b7c5ff;
}

</style>
</head>
<body>

<div class="bg"></div>
<div class="fog"></div>

<canvas id="visualizer"></canvas>

<div class="logo" id="logo">
SUX
</div>

<div class="slogan" id="slogan">
PRESENCE • FLOW • SIGNAL
</div>

<div class="top-bar hidden" id="topBar">

    <div class="user">

        <div class="avatar">
        🦀
        </div>

        <div>
        Краб Гражданин
        </div>

    </div>

    <div class="balance">
    12 500 кр.
    </div>

</div>

<div class="content hidden" id="content">

    <div class="card">
        <h2>ЭФИРНЫЙ ПРОТОКОЛ</h2>
        <br>
        <p>
        Система активна.
        Соединение стабильно.
        </p>
    </div>

</div>

<div class="bottom">

    <div class="menu">

        <button class="tab active"
        data-tab="home">
        🏠
        </button>

        <button class="tab"
        data-tab="profile">
        👤
        </button>

        <button class="tab"
        data-tab="bank">
        🏦
        </button>

        <button class="tab"
        data-tab="darknet">
        🕶️
        </button>

        <button class="tab"
        data-tab="court">
        ⚖️
        </button>

        <button class="tab"
        data-tab="housing">
        🏙️
        </button>

    </div>

</div>

<script>

/* =========================
   CANVAS
========================= */

const canvas =
document.getElementById('visualizer');

const ctx =
canvas.getContext('2d');

let w,h,cx,cy;

function resize(){

    w = canvas.width =
    innerWidth;

    h = canvas.height =
    innerHeight;

    cx = w/2;
    cy = h/2 - 30;
}

resize();

addEventListener('resize',resize);

/* =========================
   ORB
========================= */

let time = 0;

function drawOrb(){

    ctx.clearRect(0,0,w,h);

    time += 0.008;

    /* =========================
       OUTER SOFT GLOW
    ========================= */

    const glow =
    ctx.createRadialGradient(
        cx,
        cy,
        40,
        cx,
        cy,
        260
    );

    glow.addColorStop(
    0,
    'rgba(90,110,255,.08)');

    glow.addColorStop(
    .45,
    'rgba(70,90,220,.045)');

    glow.addColorStop(
    1,
    'rgba(0,0,0,0)');

    ctx.fillStyle = glow;

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        260,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* =========================
       MAIN ORB
    ========================= */

    const pulse =
    Math.sin(time*2)*4;

    const radius =
    90 + pulse;

    const grad =
    ctx.createRadialGradient(
        cx - 24,
        cy - 24,
        10,

        cx,
        cy,
        radius
    );

    grad.addColorStop(
    0,
    'rgba(120,140,255,.9)');

    grad.addColorStop(
    .25,
    'rgba(70,90,210,.82)');

    grad.addColorStop(
    .55,
    'rgba(35,45,120,.92)');

    grad.addColorStop(
    1,
    'rgba(10,14,40,.98)');

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        radius,
        0,
        Math.PI*2
    );

    ctx.fillStyle = grad;

    ctx.shadowBlur = 40;
    ctx.shadowColor =
    'rgba(80,110,255,.18)';

    ctx.fill();

    ctx.shadowBlur = 0;

    /* =========================
       INNER FLOW
    ========================= */

    for(let i=0;i<7;i++){

        ctx.beginPath();

        const r =
        radius * (.55 + i*.07);

        ctx.arc(
            cx +
            Math.sin(time+i)*3,

            cy +
            Math.cos(time*1.2+i)*3,

            r,
            0,
            Math.PI*2
        );

        ctx.strokeStyle =
        `rgba(140,160,255,${
            .015-(i*.0015)
        })`;

        ctx.lineWidth = 2;

        ctx.stroke();
    }

    /* =========================
       CENTER CORE
    ========================= */

    const core =
    ctx.createRadialGradient(
        cx,
        cy,
        0,
        cx,
        cy,
        radius*.45
    );

    core.addColorStop(
    0,
    'rgba(180,200,255,.32)');

    core.addColorStop(
    .5,
    'rgba(100,120,255,.08)');

    core.addColorStop(
    1,
    'rgba(0,0,0,0)');

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        radius*.45,
        0,
        Math.PI*2
    );

    ctx.fillStyle = core;
    ctx.fill();

    /* =========================
       FLOATING PARTICLES
    ========================= */

    for(let i=0;i<28;i++){

        const angle =
        (Math.PI*2/28)*i +
        time*.2;

        const dist =
        145 +
        Math.sin(time*2+i)*8;

        const px =
        cx + Math.cos(angle)*dist;

        const py =
        cy + Math.sin(angle)*dist;

        ctx.beginPath();

        ctx.arc(
            px,
            py,
            1.2 +
            Math.sin(time+i)*.4,
            0,
            Math.PI*2
        );

        ctx.fillStyle =
        'rgba(120,140,255,.12)';

        ctx.fill();
    }

    requestAnimationFrame(drawOrb);
}

drawOrb();

/* =========================
   UI
========================= */

const tabs =
document.querySelectorAll('.tab');

const logo =
document.getElementById('logo');

const slogan =
document.getElementById('slogan');

const topBar =
document.getElementById('topBar');

const content =
document.getElementById('content');

function setTab(tab){

    tabs.forEach(btn=>{

        btn.classList.remove('active');

        if(btn.dataset.tab === tab){

            btn.classList.add('active');
        }
    });

    if(tab === 'home'){

        logo.classList.remove('hidden');
        slogan.classList.remove('hidden');

        topBar.classList.add('hidden');
        content.classList.add('hidden');

        canvas.style.opacity = '1';

        return;
    }

    logo.classList.add('hidden');
    slogan.classList.add('hidden');

    topBar.classList.remove('hidden');
    content.classList.remove('hidden');

    canvas.style.opacity = '.08';
}

tabs.forEach(btn=>{

    btn.addEventListener('click',()=>{

        setTab(btn.dataset.tab);
    });
});

setTab('home');

</script>
</body>
</html>
